<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live or Die (LoD)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      overflow: hidden;
    }

    /* 3D Canvas */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* BGM (YouTube Iframe) Hidden */
    #bgm-container {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      overflow: hidden;
      pointer-events: none;
    }

    /* タイトル画面（左右分割） */
    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      background: rgba(5, 5, 5, 0.95);
      transition: opacity 0.8s ease;
    }

    .left-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 2px solid #222;
      padding: 40px;
      background: radial-gradient(circle, #1a0505 0%, #000 80%);
    }

    .title-logo {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.2;
      color: #eee;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .lod-highlight {
      color: #ff0000;
      font-size: 5rem;
      text-shadow: 0 0 25px #ff0000, 0 0 50px #880000;
      display: inline-block;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { text-shadow: 0 0 15px #ff0000; transform: scale(1); }
      100% { text-shadow: 0 0 35px #ff0000, 0 0 60px #ff0000; transform: scale(1.03); }
    }

    .subtitle {
      margin-top: 20px;
      color: #666;
      font-size: 1rem;
      letter-spacing: 2px;
    }

    .right-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background: #080808;
    }

    .join-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .input-label {
      font-size: 0.9rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .code-input {
      width: 100%;
      padding: 15px;
      background: #111;
      border: 2px solid #333;
      color: #ff0000;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 8px;
      font-family: monospace;
      border-radius: 4px;
      outline: none;
      transition: border 0.3s;
    }

    .code-input:focus {
      border-color: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.2s;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
      background: #cc0000;
    }

    .btn-secondary {
      background: #222;
      border: 1px solid #444;
      box-shadow: none;
      color: #aaa;
    }

    .btn-secondary:hover {
      background: #333;
      color: #fff;
    }

    .status-msg {
      margin-top: 15px;
      color: #ffcc00;
      font-size: 0.9rem;
      min-height: 24px;
      text-align: center;
    }

    /* ゲームUI オーバーレイ */
    #game-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .player-card {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #333;
      padding: 12px 20px;
      border-radius: 6px;
      min-width: 200px;
    }

    .player-name {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 5px;
    }

    .health-bar {
      display: flex;
      gap: 6px;
    }

    .hp-node {
      width: 18px;
      height: 18px;
      background: #ff0000;
      box-shadow: 0 0 8px #ff0000;
      border-radius: 2px;
    }

    .hp-node.empty {
      background: #222;
      box-shadow: none;
    }

    .shell-counter {
      background: rgba(0,0,0,0.8);
      border: 1px solid #444;
      padding: 10px 20px;
      border-radius: 20px;
      color: #ffcc00;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-align: center;
    }

    /* ゲーム操作パネル（下部） */
    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      pointer-events: auto;
    }

    .items-container {
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.7);
      padding: 8px 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .item-btn {
      width: 50px;
      height: 50px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .item-btn:hover {
      border-color: #ff0000;
      background: #2a2a2a;
    }

    .action-controls {
      display: flex;
      gap: 20px;
    }

    .act-btn {
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ff0000;
      background: rgba(200, 0, 0, 0.2);
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      letter-spacing: 1px;
    }

    .act-btn:hover {
      background: #ff0000;
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
    }

    .turn-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 0 0 20px #000;
      letter-spacing: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    /* スマホ横画面固定案内 */
    #orient-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    @media (orientation: portrait) {
      #orient-warning {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- 横画面推奨警告 -->
  <div id="orient-warning">
    <div style="font-size: 3rem; margin-bottom: 20px;">🔄</div>
    <h2>画面を横向きにしてください</h2>
    <p style="color: #888; margin-top: 10px;">Live or Die (LoD) は横画面専用です</p>
  </div>

  <!-- YouTube BGM (自動再生・ループ) -->
  <div id="bgm-container">
    <iframe id="youtube-bgm" width="100" height="100" src="https://www.youtube.com/embed/lRjJk4xhHHE?enablejsapi=1&autoplay=1&loop=1&playlist=lRjJk4xhHHE" frameborder="0" allow="autoplay"></iframe>
  </div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="left-half">
      <div class="title-logo">
        <span class="lod-highlight">L</span>IVE <span class="lod-highlight">o</span>r <span class="lod-highlight">D</span>IE
      </div>
      <div class="subtitle">HIGH STAKES SHOTGUN ROULETTE</div>
    </div>
    <div class="right-half">
      <div class="join-box">
        <div class="input-label">3桁の部屋コード</div>
        <input type="text" id="roomCode" class="code-input" placeholder="777" maxlength="3" pattern="[0-9]*" inputmode="numeric">
        <button id="btn-join" class="btn">対戦を始める / 作成</button>
        <button id="btn-ai" class="btn btn-secondary">VS AI（1人プレイ）</button>
        <div id="status-msg" class="status-msg"></div>
      </div>
    </div>
  </div>

  <!-- ゲームUI -->
  <div id="game-ui" style="display: none;">
    <div class="hud-top">
      <div class="player-card">
        <div class="player-name">OPPONENT</div>
        <div id="opp-hp" class="health-bar"></div>
      </div>
      <div class="shell-counter">
        弾薬: <span id="live-count" style="color:#ff3333;">?</span> 実弾 / <span id="blank-count" style="color:#aaa;">?</span> 空砲
      </div>
      <div class="player-card">
        <div class="player-name">YOU</div>
        <div id="my-hp" class="health-bar"></div>
      </div>
    </div>

    <div id="turn-banner" class="turn-banner">YOUR TURN</div>

    <div class="hud-bottom">
      <div id="items-panel" class="items-container">
        <!-- アイテムボタン群 -->
      </div>
      <div class="action-controls">
        <button id="btn-shoot-opp" class="act-btn">相手を撃つ</button>
        <button id="btn-shoot-self" class="act-btn" style="border-color: #666; background: rgba(50,50,50,0.4);">自分を撃つ</button>
      </div>
    </div>
  </div>

  <!-- ライブラリ読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    // --- 1. Sound Engine (Web Audio API Synthesizer) ---
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      resume() {
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // 銃のラック（スライド引く音）
      playRack() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }

      // 実弾発射音（重低音ノイズ）
      playShot() {
        this.resume();
        const now = this.ctx.currentTime;
        
        // ノイズバースト
        const bufferSize = this.ctx.sampleRate * 0.4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, now);
        filter.frequency.linearRampToValueAtTime(100, now + 0.4);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(now);
        noise.stop(now + 0.4);
      }

      // 空砲クリック音（カチッ）
      playClick() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      }

      // アイテム使用音
      playItem() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    const sound = new SoundEngine();

    // --- 2. 3D Graphics Setup (Three.js) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 3.5);
    camera.lookAt(0, 0, -0.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 照明
    scene.add(new THREE.AmbientLight(0x111111));
    
    // スポットライト（テーブル直上）
    const spotLight = new THREE.SpotLight(0xff4422, 3, 10, Math.PI / 4, 0.5);
    spotLight.position.set(0, 4, 0);
    spotLight.castShadow = true;
    scene.add(spotLight);

    // テーブル
    const tableGeo = new THREE.BoxGeometry(3, 0.1, 2);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
    const table = new THREE.Mesh(tableGeo, tableMat);
    table.position.set(0, 0, 0);
    table.receiveShadow = true;
    scene.add(table);

    // 銃（3D簡易モデル）
    const gunGroup = new THREE.Group();
    const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.2, 16);
    const metalMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.3 });
    const barrel = new THREE.Mesh(barrelGeo, metalMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.08, 0);
    gunGroup.add(barrel);

    const stockGeo = new THREE.BoxGeometry(0.08, 0.12, 0.4);
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x3a1e05, roughness: 0.6 });
    const stock = new THREE.Mesh(stockGeo, woodMat);
    stock.position.set(0, 0.04, 0.6);
    gunGroup.add(stock);

    gunGroup.position.set(0, 0.1, 0);
    scene.add(gunGroup);

    // リサイズ対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // レンダリングループ
    function render() {
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    }
    render();

    // --- 3. Game Core Logic & P2P Networking ---
    let peer = null;
    let conn = null;
    let isHost = false;
    let isAI = false;
    const PREFIX = "lod-game-room-";

    let gameState = {
      myHp: 3,
      oppHp: 3,
      maxHp: 3,
      magazine: [], // true: 実弾, false: 空砲
      currentTurn: 'host', // 'host' or 'guest'
      sawActive: false
    };

    // YouTube BGMの再生開始
    function startBGM() {
      const iframe = document.getElementById('youtube-bgm');
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }

    // UI更新
    function updateUI() {
      // HP描画
      const myHpDiv = document.getElementById('my-hp');
      const oppHpDiv = document.getElementById('opp-hp');
      myHpDiv.innerHTML = '';
      oppHpDiv.innerHTML = '';

      for (let i = 0; i < gameState.maxHp; i++) {
        myHpDiv.innerHTML += `<div class="hp-node ${i < gameState.myHp ? '' : 'empty'}"></div>`;
        oppHpDiv.innerHTML += `<div class="hp-node ${i < gameState.oppHp ? '' : 'empty'}"></div>`;
      }

      // 残弾数カウント
      const live = gameState.magazine.filter(b => b).length;
      const blank = gameState.magazine.filter(b => !b).length;
      document.getElementById('live-count').innerText = live;
      document.getElementById('blank-count').innerText = blank;

      // ターン表示
      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');
      const banner = document.getElementById('turn-banner');
      banner.innerText = isMyTurn ? "YOUR TURN" : "OPPONENT'S TURN";
      banner.style.opacity = '1';
      setTimeout(() => { banner.style.opacity = '0'; }, 1500);

      document.getElementById('btn-shoot-opp').style.pointerEvents = isMyTurn ? 'auto' : 'none';
      document.getElementById('btn-shoot-self').style.pointerEvents = isMyTurn ? 'auto' : 'none';
    }

    // 新しいラウンドの弾丸装填
    function reloadMagazine() {
      sound.playRack();
      const total = Math.floor(Math.random() * 5) + 2; // 2〜6発
      let live = Math.floor(Math.random() * (total - 1)) + 1;
      let blank = total - live;

      const mag = [];
      for (let i = 0; i < live; i++) mag.push(true);
      for (let i = 0; i < blank; i++) mag.push(false);
      
      // シャッフル
      for (let i = mag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mag[i], mag[j]] = [mag[j], mag[i]];
      }

      gameState.magazine = mag;
    }

    // 接続イベント
    document.getElementById('btn-join').addEventListener('click', () => {
      startBGM();
      sound.resume();
      const code = document.getElementById('roomCode').value;
      if (code.length !== 3) {
        document.getElementById('status-msg').innerText = "3桁の数字を入力してください";
        return;
      }

      const roomID = PREFIX + code;
      document.getElementById('status-msg').innerText = "部屋に接続中...";

      peer = new Peer(roomID);

      peer.on('open', () => {
        isHost = true;
        document.getElementById('status-msg').innerText = "部屋を作成しました。相手を待っています...";
        
        peer.on('connection', (c) => {
          conn = c;
          setupNetwork();
          startGame();
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          isHost = false;
          peer.destroy();
          peer = new Peer();
          peer.on('open', () => {
            conn = peer.connect(roomID);
            setupNetwork();
            startGame();
          });
        }
      });
    });

    // VS AI プレイ
    document.getElementById('btn-ai').addEventListener('click', () => {
      startBGM();
      sound.resume();
      isAI = true;
      isHost = true;
      startGame();
    });

    function setupNetwork() {
      conn.on('data', (data) => {
        handleAction(data);
      });
    }

    function startGame() {
      document.getElementById('title-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
      }, 800);

      if (isHost) {
        reloadMagazine();
        updateUI();
        if (!isAI && conn) conn.send({ type: 'INIT', state: gameState });
      }
    }

    // ショット処理
    function shoot(target) {
      if (gameState.magazine.length === 0) return;

      const isLive = gameState.magazine.pop();
      const damage = gameState.sawActive ? 2 : 1;
      gameState.sawActive = false;

      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');

      if (isLive) {
        sound.playShot();
        // 銃口フラッシュアニメーション
        spotLight.intensity = 10;
        setTimeout(() => { spotLight.intensity = 3; }, 100);

        if (target === 'opp') {
          gameState.oppHp = Math.max(0, gameState.oppHp - damage);
        } else {
          gameState.myHp = Math.max(0, gameState.myHp - damage);
        }

        // ターン交代
        gameState.currentTurn = gameState.currentTurn === 'host' ? 'guest' : 'host';
      } else {
        sound.playClick();
        // 自分を撃って空砲ならもう1ターン
        if (target === 'opp') {
          gameState.currentTurn = gameState.currentTurn === 'host' ? 'guest' : 'host';
        }
      }

      // 弾が尽きたら再装填
      if (gameState.magazine.length === 0) {
        setTimeout(reloadMagazine, 1000);
      }

      updateUI();

      // 勝敗判定
      if (gameState.myHp <= 0 || gameState.oppHp <= 0) {
        setTimeout(() => {
          alert(gameState.myHp > 0 ? "YOU SURVIVED!" : "YOU DIED...");
          location.reload();
        }, 500);
      }

      // AIのターン
      if (isAI && gameState.currentTurn === 'guest' && gameState.oppHp > 0) {
        setTimeout(aiTurn, 1500);
      }
    }

    // AIの思考ロジック
    function aiTurn() {
      const live = gameState.magazine.filter(b => b).length;
      const total = gameState.magazine.length;
      
      // 実弾の確率が高いならプレイヤーを撃つ
      if (live / total >= 0.5) {
        shoot('my'); // AIにとっての相手（プレイヤー）
      } else {
        shoot('opp'); // AIが自分を撃つ
      }
    }

    // アクション受信処理
    function handleAction(data) {
      if (data.type === 'INIT') {
        gameState = data.state;
        updateUI();
      }
    }

    // 操作イベント登録
    document.getElementById('btn-shoot-opp').addEventListener('click', () => {
