<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live or Die (LoD) ver0.3 Monster Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* BGM (YouTube Iframe) */
    #bgm-container {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      overflow: hidden;
      pointer-events: none;
    }

    /* 除細動器・ゲームオーバー演出 */
    #resus-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease;
    }
    #resus-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .resus-text {
      color: #00ffcc;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 25px #00ffcc;
      animation: blink 0.3s infinite alternate;
    }
    .death-text {
      color: #ff0000;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-shadow: 0 0 30px #ff0000;
    }
    @keyframes blink {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    /* タイトル画面 */
    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      background: rgba(5, 5, 5, 0.95);
      transition: opacity 0.8s ease;
    }

    .left-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 2px solid #222;
      padding: 40px;
      background: radial-gradient(circle, #1a0505 0%, #000 80%);
    }

    .title-logo {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.2;
      color: #eee;
    }

    .lod-highlight {
      color: #ff0000;
      font-size: 4.8rem;
      text-shadow: 0 0 25px #ff0000;
      display: inline-block;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .right-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background: #080808;
    }

    .join-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .code-input {
      width: 100%;
      padding: 15px;
      background: #111;
      border: 2px solid #333;
      color: #ff0000;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 8px;
      font-family: monospace;
      border-radius: 4px;
      outline: none;
    }
    .code-input:focus {
      border-color: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      box-shadow: none;
    }

    .status-msg {
      margin-top: 10px;
      color: #ffcc00;
      font-size: 0.9rem;
      text-align: center;
      min-height: 20px;
    }

    /* HUD UI */
    #game-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .player-card {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #333;
      padding: 12px 20px;
      border-radius: 6px;
      min-width: 200px;
    }

    .player-name {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 5px;
    }

    .health-bar {
      display: flex;
      gap: 6px;
    }

    .hp-node {
      width: 18px;
      height: 18px;
      background: #ff0000;
      box-shadow: 0 0 8px #ff0000;
      border-radius: 50%;
    }
    .hp-node.empty {
      background: #222;
      box-shadow: none;
    }

    .shell-counter {
      background: rgba(0,0,0,0.85);
      border: 1px solid #444;
      padding: 8px 18px;
      border-radius: 20px;
      color: #ffcc00;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .action-controls {
      display: flex;
      gap: 15px;
    }

    .act-btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #ff0000;
      background: rgba(200, 0, 0, 0.2);
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .act-btn:hover:not(:disabled) {
      background: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }
    .act-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #444;
      background: rgba(30,30,30,0.4);
    }

    .turn-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 0 0 20px #000;
      letter-spacing: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      text-align: center;
    }

    #orient-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    @media (orientation: portrait) {
      #orient-warning { display: flex; }
    }
  </style>
</head>
<body>

  <!-- 横画面推奨警告 -->
  <div id="orient-warning">
    <div style="font-size: 3rem; margin-bottom: 10px;">🔄</div>
    <h2>画面を横向きにしてください</h2>
  </div>

  <!-- 除細動器・死亡オーバーレイ -->
  <div id="resus-overlay">
    <div id="resus-title" class="resus-text">⚡ CLEAR! ⚡</div>
    <div style="color: #aaa; margin-top: 15px; font-size: 1.1rem;" id="resus-sub">除細動器起動中...</div>
  </div>

  <!-- YouTube BGM -->
  <div id="bgm-container">
    <iframe id="youtube-bgm" width="100" height="100" src="https://www.youtube.com/embed/lRjJk4xhHHE?enablejsapi=1&autoplay=1&loop=1&playlist=lRjJk4xhHHE" frameborder="0" allow="autoplay"></iframe>
  </div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="left-half">
      <div class="title-logo">
        <span class="lod-highlight">L</span>IVE <span class="lod-highlight">o</span>r <span class="lod-highlight">D</span>IE
      </div>
      <div style="color:#666; margin-top:15px; letter-spacing:2px;">ver0.3 MONSTER EDITION</div>
    </div>
    <div class="right-half">
      <div class="join-box">
        <div style="color:#888; font-size:0.85rem;">3桁の部屋コード</div>
        <input type="text" id="roomCode" class="code-input" placeholder="777" maxlength="3" pattern="[0-9]*" inputmode="numeric">
        <button id="btn-join" class="btn">対戦を始める / 作成</button>
        <button id="btn-ai" class="btn btn-secondary">VS AI（1人プレイ）</button>
        <div id="status-msg" class="status-msg"></div>
      </div>
    </div>
  </div>

  <!-- ゲームUI -->
  <div id="game-ui" style="display: none;">
    <div class="hud-top">
      <div class="player-card">
        <div class="player-name">MONSTER (OPPONENT)</div>
        <div id="opp-hp" class="health-bar"></div>
      </div>
      <div class="shell-counter">
        残弾: <span id="live-count" style="color:#ff3333; font-weight:bold;">?</span> 実弾 / <span id="blank-count" style="color:#aaa; font-weight:bold;">?</span> 空砲
      </div>
      <div class="player-card">
        <div class="player-name">YOU</div>
        <div id="my-hp" class="health-bar"></div>
      </div>
    </div>

    <div id="turn-banner" class="turn-banner">YOUR TURN</div>

    <div class="hud-bottom">
      <div class="action-controls">
        <button id="btn-shoot-opp" class="act-btn">相手を撃つ</button>
        <button id="btn-shoot-self" class="act-btn" style="border-color: #888; background: rgba(50,50,50,0.5);">自分を撃つ</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    // --- 1. Sound Engine (Synthesizer & Unique Item SEs) ---
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      resume() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // 「バン！」実弾音
      playBang() {
        this.resume();
        const now = this.ctx.currentTime;
        const bufSize = this.ctx.sampleRate * 0.5;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(60, now + 0.45);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(1.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      // 「かち」空砲音
      playKachi() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(350, now + 0.04);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      // 除細動器音
      playDefibrillator() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(900, now + 1.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 1.2);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);

        setTimeout(() => {
          const shock = this.ctx.createOscillator();
          const sgain = this.ctx.createGain();
          shock.type = 'square';
          shock.frequency.setValueAtTime(120, this.ctx.currentTime);
          shock.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.35);
          sgain.gain.setValueAtTime(1.0, this.ctx.currentTime);
          sgain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
          shock.connect(sgain);
          sgain.connect(this.ctx.destination);
          shock.start();
        }, 1200);
      }

      playRack() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      // アイテム専用SE群
      playItemSaw() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        osc.frequency.linearRampToValueAtTime(400, now + 0.4);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      playItemMagnifier() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      playItemBeer() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      playItemCigarette() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      playItemHandcuffs() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(400, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }
    }

    const sound = new SoundEngine();

    // --- 2. 3D Graphics Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.3, 3.2);
    camera.lookAt(0, 0.6, -0.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x151515));
    const spotLight = new THREE.SpotLight(0xff3311, 3.5, 12, Math.PI / 3, 0.5);
    spotLight.position.set(0, 4.5, 0);
    spotLight.castShadow = true;
    scene.add(spotLight);

    // 自分側・相手側の分割テーブル
    const myTableGeo = new THREE.BoxGeometry(2.8, 0.1, 1.0);
    const oppTableGeo = new THREE.BoxGeometry(2.8, 0.1, 1.0);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.8 });

    const myTable = new THREE.Mesh(myTableGeo, tableMat);
    myTable.position.set(0, 0, 0.6);
    scene.add(myTable);

    const oppTable = new THREE.Mesh(oppTableGeo, tableMat);
    oppTable.position.set(0, 0, -0.6);
    scene.add(oppTable);

    // 審判NPC
    const dealerGroup = new THREE.Group();
    const dealerHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    dealerHead.position.set(0, 1.5, -1.9);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
    const eyeR = eyeL.clone();
    eyeL.position.set(-0.1, 1.55, -1.6);
    eyeR.position.set(0.1, 1.55, -1.6);
    dealerGroup.add(dealerHead, eyeL, eyeR);
    scene.add(dealerGroup);

    // 👹 不気味なモンスター対戦相手（顔＋手）
    const oppMonsterGroup = new THREE.Group();

    // モンスターの頭部（長頭）
    const headGeo = new THREE.ConeGeometry(0.4, 0.8, 8);
    const monsterMat = new THREE.MeshStandardMaterial({ color: 0x1a241a, roughness: 0.9, metalness: 0.1 });
    const monsterHead = new THREE.Mesh(headGeo, monsterMat);
    monsterHead.rotation.x = Math.PI;
    monsterHead.position.set(0, 1.3, -1.1);

    // 複数の不揃いな目
    const mEyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
    for (let i = 0; i < 5; i++) {
      const me = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), mEyeMat);
      me.position.set((Math.random() - 0.5) * 0.3, 1.2 + (Math.random() - 0.5) * 0.2, -0.88);
      oppMonsterGroup.add(me);
    }

    // 長い下顎・角
    const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.05, 0.4), monsterMat);
    horn.position.set(0, 1.6, -1.1);
    oppMonsterGroup.add(horn);

    // モンスターの手（テーブルの上に乗っている）
    const oppHandMat = new THREE.MeshStandardMaterial({ color: 0x111a11 });
    const oppLeftHand = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.06, 0.3), oppHandMat);
    const oppRightHand = oppLeftHand.clone();
    oppLeftHand.position.set(-0.6, 0.12, -0.4);
    oppRightHand.position.set(0.6, 0.12, -0.4);

    oppMonsterGroup.add(monsterHead, oppLeftHand, oppRightHand);
    scene.add(oppMonsterGroup);

    // ✋ 自分側の手（画面手前左右から伸びている）
    const myHandMat = new THREE.MeshStandardMaterial({ color: 0x3d281d });
    const myLeftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.8), myHandMat);
    const myRightArm = myLeftArm.clone();

    myLeftArm.rotation.x = Math.PI / 3;
    myLeftArm.rotation.z = -Math.PI / 6;
    myLeftArm.position.set(-0.8, 0.3, 1.2);

    myRightArm.rotation.x = Math.PI / 3;
    myRightArm.rotation.z = Math.PI / 6;
    myRightArm.position.set(0.8, 0.3, 1.2);

    scene.add(myLeftArm, myRightArm);

    // 血のパーティクル
    const bloodParticles = [];
    function spawnBlood() {
      for (let i = 0; i < 40; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.03, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xaa0000 })
        );
        p.position.set(0, 1.2, -0.8);
        p.userData = {
          vx: (Math.random() - 0.5) * 0.1,
          vy: Math.random() * 0.1 + 0.02,
          vz: (Math.random() - 0.5) * 0.1
        };
        scene.add(p);
        bloodParticles.push(p);
      }
    }

    // ショットガン
    const gunGroup = new THREE.Group();
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 }));
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.08, 0);
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.4), new THREE.MeshStandardMaterial({ color: 0x3a1e05 }));
    stock.position.set(0, 0.04, 0.6);
    gunGroup.add(barrel, stock);
    gunGroup.position.set(0, 0.15, 0);
    scene.add(gunGroup);

    // Raycaster (3Dアイテムクリック検知用)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // 3Dアイテム表示グループ
    const item3DGroup = new THREE.Group();
    scene.add(item3DGroup);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let oppHeadBaseY = 0;
    function renderAnim() {
      requestAnimationFrame(renderAnim);
      monsterHead.position.y = 1.3 + Math.sin(Date.now() * 0.003) * 0.04 + oppHeadBaseY;

      for (let i = bloodParticles.length - 1; i >= 0; i--) {
        const p = bloodParticles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.vy -= 0.004;
        if (p.position.y < 0.05) {
          scene.remove(p);
          bloodParticles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    renderAnim();

    // --- 3. Items Definitions ---
    const ITEMS_DEF = {
      saw: { name: 'ノコギリ', color: 0xff3333, se: () => sound.playItemSaw() },
      magnifier: { name: '虫眼鏡', color: 0x33ffff, se: () => sound.playItemMagnifier() },
      beer: { name: 'ビール', color: 0xffff33, se: () => sound.playItemBeer() },
      cigarette: { name: 'タバコ', color: 0xffffff, se: () => sound.playItemCigarette() },
      handcuffs: { name: '手錠', color: 0xaaaaaa, se: () => sound.playItemHandcuffs() }
    };

    // --- 4. Game Logic & P2P Network ---
    let peer = null;
    let conn = null;
    let isHost = false;
    let isAI = false;
    const PREFIX = "lod-game-room-v3-";

    let gameState = {
      myHp: 5,        // ハート5個
      oppHp: 5,       // ハート5個
      maxHp: 5,
      magazine: [],
      currentTurn: 'host',
      roundCount: 1,
      sawActive: false,
      handcuffed: false,
      myItems: [],
      oppItems: []
    };

    function startBGM() {
      const iframe = document.getElementById('youtube-bgm');
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }

    // テーブル上への3Dアイテムメッシュ配置
    function rebuild3DItems() {
      while(item3DGroup.children.length > 0) {
        item3DGroup.remove(item3DGroup.children[0]);
      }

      // 自分側のテーブル（手前 z=0.6）
      gameState.myItems.forEach((itemKey, i) => {
        const def = ITEMS_DEF[itemKey];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: def.color }));
        mesh.position.set(-0.9 + i * 0.25, 0.12, 0.6);
        mesh.userData = { itemKey, index: i, owner: 'me' };
        item3DGroup.add(mesh);
      });

      // 相手側のテーブル（奥 z=-0.6）
      gameState.oppItems.forEach((itemKey, i) => {
        const def = ITEMS_DEF[itemKey];
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), new THREE.MeshStandardMaterial({ color: def.color }));
        mesh.position.set(-0.9 + i * 0.25, 0.12, -0.6);
        mesh.userData = { itemKey, index: i, owner: 'opp' };
        item3DGroup.add(mesh);
      });
    }

    function updateUI() {
      const myHpDiv = document.getElementById('my-hp');
      const oppHpDiv = document.getElementById('opp-hp');
      myHpDiv.innerHTML = '';
      oppHpDiv.innerHTML = '';

      for (let i = 0; i < gameState.maxHp; i++) {
        myHpDiv.innerHTML += `<div class="hp-node ${i < gameState.myHp ? '' : 'empty'}"></div>`;
        oppHpDiv.innerHTML += `<div class="hp-node ${i < gameState.oppHp ? '' : 'empty'}"></div>`;
      }

      const live = gameState.magazine.filter(b => b).length;
      const blank = gameState.magazine.filter(b => !b).length;
      document.getElementById('live-count').innerText = live;
      document.getElementById('blank-count').innerText = blank;

      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');

      const banner = document.getElementById('turn-banner');
      banner.innerText = isMyTurn ? "YOUR TURN" : "MONSTER'S TURN";
      banner.style.opacity = '1';
      setTimeout(() => { banner.style.opacity = '0'; }, 1200);

      document.getElementById('btn-shoot-opp').disabled = !isMyTurn;
      document.getElementById('btn-shoot-self').disabled = !isMyTurn;

      rebuild3DItems();
    }

    // ラウンド進行＆アイテムランダム生成（ターン数に応じて複数支給）
    function startRoundSequence() {
      document.getElementById('btn-shoot-opp').disabled = true;
      document.getElementById('btn-shoot-self').disabled = true;

      sound.playRack();
      
      const total = Math.floor(Math.random() * 4) + 3;
      let live = Math.floor(Math.random() * (total - 1)) + 1;
      let blank = total - live;

      const mag = [];
      for (let i = 0; i < live; i++) mag.push(true);
      for (let i = 0; i < blank; i++) mag.push(false);
      for (let i = mag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mag[i], mag[j]] = [mag[j], mag[i]];
      }
      gameState.magazine = mag;

      // ターン数（ラウンド）に応じた配布数（1〜3個）
      const giveCount = Math.min(3, Math.floor(gameState.roundCount / 2) + 1);
      for (let k = 0; k < giveCount; k++) {
        if (gameState.myItems.length < 5) gameState.myItems.push(getRandomItemKey());
        if (gameState.oppItems.length < 5) gameState.oppItems.push(getRandomItemKey());
      }
      gameState.roundCount++;

      // ショットガンルーレット回転演出
      let startTime = Date.now();
      let duration = 2000;
      let initialRot = gunGroup.rotation.y;
      let targetRot = initialRot + Math.PI * 6 + (Math.random() > 0.5 ? 0 : Math.PI);

      function spinAnim() {
        let elapsed = Date.now() - startTime;
        let progress = Math.min(elapsed / duration, 1);
        let easeOut = 1 - Math.pow(1 - progress, 3);
        gunGroup.rotation.y = initialRot + (targetRot - initialRot) * easeOut;

        if (progress < 1) {
          requestAnimationFrame(spinAnim);
        } else {
          const isFacingMe = Math.abs(gunGroup.rotation.y % (Math.PI * 2)) < 1;
          gameState.currentTurn = isFacingMe ? (isHost ? 'host' : 'guest') : (isHost ? 'guest' : 'host');
          updateUI();
          syncState();

          if (isAI && gameState.currentTurn === 'guest') {
            setTimeout(aiTurn, 1500);
          }
        }
      }
      spinAnim();
    }

    function getRandomItemKey() {
      const keys = Object.keys(ITEMS_DEF);
      return keys[Math.floor(Math.random() * keys.length)];
    }

    // 3Dアイテム使用アニメーション ＆ SE
    function trigger3DItemUse(mesh, itemKey, onComplete) {
      const def = ITEMS_DEF[itemKey];
      if (def && def.se) def.se();

      let startY = mesh.position.y;
      let startTime = Date.now();
      
      function itemAnim() {
        let elapsed = Date.now() - startTime;
        let progress = Math.min(elapsed / 600, 1);

        mesh.position.y = startY + Math.sin(progress * Math.PI) * 0.4;
        mesh.rotation.y += 0.1;

        if (progress < 1) {
          requestAnimationFrame(itemAnim);
        } else {
          if (onComplete) onComplete();
        }
      }
      itemAnim();
    }

    // クリック（タップ）での3Dアイテム使用処理
    window.addEventListener('click', (e) => {
      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');
      if (!isMyTurn) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(item3DGroup.children);

      if (intersects.length > 0) {
        const clickedObj = intersects[0].object;
        if (clickedObj.userData && clickedObj.userData.owner === 'me') {
          const { itemKey, index } = clickedObj.userData;
          
          trigger3DItemUse(clickedObj, itemKey, () => {
            gameState.myItems.splice(index, 1);
            executeItemLogic(itemKey);
            updateUI();
            syncState();
          });
        }
      }
    });

    function executeItemLogic(itemKey) {
      if (itemKey === 'saw') {
        gameState.sawActive = true;
        alert("ノコギリ: ダメージ2倍！");
      } else if (itemKey === 'magnifier') {
        const nextBullet = gameState.magazine[gameState.magazine.length - 1];
        alert(`虫眼鏡: 次の弾薬は【 ${nextBullet ? '実弾' : '空砲'} 】`);
      } else if (itemKey === 'beer') {
        const ejected = gameState.magazine.pop();
        sound.playRack();
        alert(`ビール: 【 ${ejected ? '実弾' : '空砲'} 】を排除！`);
      } else if (itemKey === 'cigarette') {
        if (gameState.myHp < gameState.maxHp) gameState.myHp++;
        alert("タバコ: ハート(HP)が1回復！");
      } else if (itemKey === 'handcuffs') {
        gameState.handcuffed = true;
        alert("手錠: 相手の次のターンをスキップ！");
      }
    }

    function shoot(target) {
      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');
      if (!isMyTurn) return;

      document.getElementById('btn-shoot-opp').disabled = true;
      document.getElementById('btn-shoot-self').disabled = true;

      // モンスターの前進アニメーション
      oppMonsterGroup.position.z = 0.15;
      setTimeout(() => { oppMonsterGroup.position.z = 0; }, 300);

      const isLive = gameState.magazine.pop();
      const damage = gameState.sawActive ? 2 : 1;
      gameState.sawActive = false;

      if (isLive) {
        sound.playBang();
        spotLight.intensity = 10;
        setTimeout(() => { spotLight.intensity = 3.5; }, 120);

        if (target === 'opp') {
          gameState.oppHp = Math.max(0, gameState.oppHp - damage);
          spawnBlood();
        } else {
          gameState.myHp = Math.max(0, gameState.myHp - damage);
        }

        if (gameState.handcuffed) {
          gameState.handcuffed = false;
        } else {
          gameState.currentTurn = gameState.currentTurn === 'host' ? 'guest' : 'host';
        }
      } else {
        sound.playKachi();
        if (target === 'opp') {
          if (gameState.handcuffed) {
            gameState.handcuffed = false;
          } else {
            gameState.currentTurn = gameState.currentTurn === 'host' ? 'guest' : 'host';
          }
        }
      }

      updateUI();
      syncState();

      // 勝敗・死亡演出チェック
      if (gameState.myHp <= 0 || gameState.oppHp <= 0) {
        handleDeathSequence(gameState.myHp <= 0);
        return;
      }

      if (gameState.magazine.length === 0) {
        setTimeout(startRoundSequence, 1200);
      } else if (isAI && gameState.currentTurn === 'guest') {
        setTimeout(aiTurn, 1500);
      }
    }

    // ハートが残っていれば除細動器起動、0ならゲーム終了
    function handleDeathSequence(didIDie) {
      const resus = document.getElementById('resus-overlay');
      const resusTitle = document.getElementById('resus-title');
      const resusSub = document.getElementById('resus-sub');

      if (didIDie) {
        if (gameState.myHp > 0) {
          // ハートあり -> 除細動器復活
          sound.playDefibrillator();
          resusTitle.innerText = "⚡ CLEAR! ⚡";
          resusTitle.className = "resus-text";
          resusSub.innerText = "除細動器起動中...ハートが消費されました";
          resus.classList.add('active');

          setTimeout(() => {
            resus.classList.remove('active');
            updateUI();
          }, 2200);
        } else {
          // ハート0 -> 死亡終了
          resusTitle.innerText = "YOU DIED";
          resusTitle.className = "death-text";
          resusSub.innerText = "ハートがすべて失われました...";
          resus.classList.add('active');

          setTimeout(() => {
            alert("GAME OVER - あなたは命を落としました");
            location.reload();
          }, 2500);
        }
      } else {
        if (gameState.oppHp > 0) {
          sound.playDefibrillator();
          oppHeadBaseY = -0.6;
          spawnBlood();
          resusTitle.innerText = "⚡ CLEAR! ⚡";
          resusTitle.className = "resus-text";
          resusSub.innerText = "モンスターが除細動器で蘇生中...";
          resus.classList.add('active');

          setTimeout(() => {
            resus.classList.remove('active');
            oppHeadBaseY = 0;
            updateUI();
          }, 2000);
        } else {
          oppHeadBaseY = -0.8;
          spawnBlood();
          resusTitle.innerText = "VICTORY!";
          resusTitle.className = "resus-text";
          resusSub.innerText = "モンスターを完全に撃破しました！";
          resus.classList.add('active');

          setTimeout(() => {
            alert("YOU SURVIVED! あなたの勝利です！");
            location.reload();
          }, 2500);
        }
      }
    }

    function aiTurn() {
      if (gameState.currentTurn !== 'guest' || !isAI) return;

      const live = gameState.magazine.filter(b => b).length;
      const total = gameState.magazine.length;

      // AIのアイテム使用
      if (gameState.oppItems.length > 0 && Math.random() > 0.4) {
        const itemKey = gameState.oppItems.pop();
        const def = ITEMS_DEF[itemKey];
        if (def && def.se) def.se();
        executeItemLogic(itemKey);
      }

      if (live / total >= 0.5) {
        shoot('my');
      } else {
        shoot('opp');
      }
    }

    function syncState() {
      if (!isAI && conn) {
        conn.send({ type: 'SYNC', state: gameState });
      }
    }

    function setupNetwork() {
      conn.on('data', (data) => {
        if (data.type === 'SYNC') {
          gameState = data.state;
          updateUI();
          if (isAI && gameState.currentTurn === 'guest') {
            setTimeout(aiTurn, 1500);
          }
        }
      });
    }

    document.getElementById('btn-join').addEventListener('click', () => {
      startBGM();
      sound.resume();
      const code = document.getElementById('roomCode').value;
      if (code.length !== 3) {
        document.getElementById('status-msg').innerText = "3桁の数字を入力してください";
        return;
      }

      const roomID = PREFIX + code;
      document.getElementById('status-msg').innerText = "部屋に接続中...";
      peer = new Peer(roomID);

      peer.on('open', () => {
        isHost = true;
        document.getElementById('status-msg').innerText = "部屋を作成しました。相手を待っています...";
        peer.on('connection', (c) => {
          conn = c;
          setupNetwork();
          startGame();
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          isHost = false;
          peer.destroy();
          peer = new Peer();
          peer.on('open', () => {
            conn = peer.connect(roomID);
            setupNetwork();
            startGame();
          });
        }
      });
    });

    document.getElementById('btn-ai').addEventListener('click', () => {
      startBGM();
      sound.resume();
      isAI = true;
      isHost = true;
      startGame();
    });

    function startGame() {
      document.getElementById('title-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        startRoundSequence();
      }, 800);
    }

    document.getElementById('btn-shoot-opp').addEventListener('click', () => shoot('opp'));
    document.getElementById('btn-shoot-self').addEventListener('click', () => shoot('self'));
  </script>
</body>
</html>
