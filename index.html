<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070812" />
  <title>VOLT - Online Battle Arena</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #060711; color: #eef6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* 共通ネオンUI */
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at center, rgba(16, 22, 54, 0.88), rgba(5, 6, 16, 0.96));
      backdrop-filter: blur(8px); z-index: 20; padding: 16px;
    }
    .hidden { display: none !important; }

    .logo-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .logo-icon {
      width: 58px; height: 58px; border-radius: 14px;
      background: linear-gradient(135deg, #071929, #150b36);
      border: 2px solid #00f3ff;
      box-shadow: 0 0 22px rgba(0, 243, 255, 0.55), inset 0 0 12px rgba(138, 43, 226, 0.6);
      display: flex; align-items: center; justify-content: center;
    }
    .title-text h1 {
      font-size: 40px; font-weight: 900; letter-spacing: 5px; line-height: 1;
      background: linear-gradient(90deg, #00f3ff, #9d4edd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.5));
    }
    .title-text p { font-size: 11px; letter-spacing: 2.5px; color: #8ab4f8; margin-top: 4px; }

    .card {
      width: 100%; max-width: 460px;
      background: rgba(12, 16, 36, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.35);
      border-radius: 16px; padding: 18px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(98, 0, 234, 0.15);
    }
    .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
    input {
      flex: 1; background: rgba(6, 9, 22, 0.9);
      border: 1px solid rgba(0, 243, 255, 0.4); border-radius: 10px;
      color: #fff; padding: 10px 14px; font-size: 15px; outline: none;
      touch-action: auto; user-select: text; -webkit-user-select: text;
    }
    input:focus { border-color: #00f3ff; box-shadow: 0 0 12px rgba(0, 243, 255, 0.4); }

    .btn {
      border: none; border-radius: 10px; padding: 11px 16px;
      font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
      color: #fff; transition: transform 0.08s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-cyan {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      box-shadow: 0 0 16px rgba(0, 198, 255, 0.45);
    }
    .btn-purple {
      background: linear-gradient(135deg, #7b2cbf, #5a189a);
      border: 1px solid #c77dff;
      box-shadow: 0 0 16px rgba(157, 78, 221, 0.45);
    }
    .btn-gold {
      background: linear-gradient(135deg, #ff9e00, #ff5400);
      box-shadow: 0 0 18px rgba(255, 110, 0, 0.5);
    }
    .btn-full { width: 100%; margin-bottom: 10px; font-size: 15px; padding: 13px; }
    .status-msg { text-align: center; font-size: 12px; color: #ff6b8b; min-height: 18px; margin-top: 4px; }

    /* ロビー */
    .room-badge {
      text-align: center; padding: 8px; border-radius: 10px;
      background: rgba(0, 243, 255, 0.1); border: 1px dashed #00f3ff;
      margin-bottom: 12px;
    }
    .room-badge span { font-size: 28px; font-weight: 900; color: #00f3ff; letter-spacing: 6px; }
    .player-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .player-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 8px;
      font-size: 14px; font-weight: 700;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; }

    /* HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .hud-top {
      position: absolute; top: 10px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .hud-box {
      background: rgba(8, 12, 28, 0.78); border: 1px solid rgba(0, 243, 255, 0.35);
      border-radius: 12px; padding: 7px 13px; backdrop-filter: blur(4px);
    }
    .timer { font-size: 22px; font-weight: 900; color: #00f3ff; letter-spacing: 2px; text-align: center; }
    .phase-tag { font-size: 10px; color: #c77dff; text-align: center; font-weight: 700; }

    .hp-bar-bg { width: 160px; height: 12px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .hp-bar-fill { height: 100%; background: linear-gradient(90deg, #00f3ff, #39ff14); transition: width 0.12s; }
    .buff-icons { display: flex; gap: 6px; margin-top: 5px; font-size: 11px; font-weight: 800; }
    .buff-tag { padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,0.12); }

    /* キルログ & チャット */
    .feed-area {
      position: absolute; top: 72px; left: 14px;
      display: flex; flex-direction: column; gap: 4px; max-width: 240px;
    }
    .feed-item {
      background: rgba(8, 10, 24, 0.72); border-left: 3px solid #00f3ff;
      padding: 4px 8px; border-radius: 4px; font-size: 11px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

    /* クイックチャット（同盟・裏切り） */
    .chat-bar {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      margin-top: 54px; display: flex; gap: 5px; pointer-events: auto; flex-wrap: wrap; justify-content: center;
    }
    .chat-btn {
      background: rgba(18, 22, 48, 0.85); border: 1px solid rgba(157, 78, 221, 0.6);
      color: #e0aaff; border-radius: 14px; padding: 4px 10px; font-size: 11px; font-weight: 700;
      cursor: pointer;
    }
    .chat-btn:active { background: #7b2cbf; color: #fff; }

    /* スマホ操作UI */
    .touch-controls { position: absolute; inset: 0; pointer-events: none; }
    #stickZone {
      position: absolute; bottom: 18px; left: 18px;
      width: 140px; height: 140px; pointer-events: auto;
    }
    .action-btns {
      position: absolute; bottom: 22px; right: 24px;
      display: flex; gap: 16px; align-items: flex-end; pointer-events: auto;
    }
    .act-btn {
      border-radius: 50%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-weight: 900;
      color: #fff; cursor: pointer; position: relative; overflow: hidden;
    }
    #btnDash {
      width: 68px; height: 68px;
      background: radial-gradient(circle, rgba(123, 44, 191, 0.85), rgba(45, 12, 84, 0.9));
      border: 2px solid #c77dff; box-shadow: 0 0 18px rgba(199, 125, 255, 0.5);
      font-size: 12px;
    }
    #btnAtk {
      width: 86px; height: 86px;
      background: radial-gradient(circle, rgba(0, 198, 255, 0.85), rgba(0, 65, 130, 0.92));
      border: 2.5px solid #00f3ff; box-shadow: 0 0 24px rgba(0, 243, 255, 0.6);
      font-size: 15px;
    }
    .cd-mask {
      position: absolute; inset: 0; background: rgba(0,0,0,0.68);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }

    /* 横画面推奨バナー（縦持ち時） */
    #rotateHint {
      display: none; position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 0, 127, 0.85); color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px; z-index: 30; pointer-events: none;
    }
    @media (orientation: portrait) { #rotateHint { display: block; } }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="rotateHint">📱 スマホは横画面にするとプレイしやすくなります</div>

  <!-- タイトル画面 -->
  <div id="titleScreen" class="overlay">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg width="36" height="36" viewBox="0 0 100 100">

            <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">

            </linearGradient>

      <div class="input-row">

      </div>

  <!-- ロビー待機画面 -->
  <div id="lobbyScreen" class="overlay hidden">

      <div id="resultStats" style="font-size:13px; color:#cbd5e1; margin-bottom:18px; line-height:1.7;"></div>

  <!-- 戦闘HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-box">
        <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:800;">
          <span id="hudName">PLAYER</span>
          <span id="hudHpText">100 / 100</span>
        </div>
        <div class="hp-bar-bg"><div id="hudHpBar" class="hp-bar-fill" style="width:100%;"></div></div>

      <div class="hud-box">

      <div class="hud-box" style="text-align:right;">
        <div style="font-size:11px; color:#8ab4f8;">生存者</div>

    <div class="chat-bar">
      <button class="chat-btn" data-chat="🤝 組もう！">🤝 組もう！</button>
      <button class="chat-btn" data-chat="🎯 1位を狙おう">🎯 1位狙おう</button>
      <button class="chat-btn" data-chat="😈 裏切ったな！">😈 裏切ったな！</button>
      <button class="chat-btn" data-chat="🙏 ごめん！">🙏 ごめん！</button>

<script>
/* =========================================================
   1. PWA Manifest & Service Worker 動的登録（1ファイル完結用）
   ========================================================= */
(() => {
  const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#070a19"/><polygon points="90,110 200,110 256,310 312,110 422,110 256,440" fill="#00f3ff"/><polygon points="220,80 292,80 256,220" fill="#9d4edd"/></svg>`;
  const iconUrl = 'data:image/svg+xml;base64,' + btoa(iconSvg);
  const manifest = {
    name: 'VOLT - Online Battle Arena',
    short_name: 'VOLT',
    start_url: '.',
    display: 'fullscreen',
    orientation: 'landscape',
    background_color: '#060711',
    theme_color: '#060711',
    icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }]
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
})();

/* =========================================================
   2. Web Audio API シンセサイザー効果音エンジン
   ========================================================= */
class SoundFX {
  constructor() { this.ctx = null; }
  unlock() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  play(type) {
    this.unlock();
    const ctx = this.ctx;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === 'slash' || type === 'powerSlash') {
      osc.type = type === 'powerSlash' ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(type === 'powerSlash' ? 520 : 380, now);
      osc.frequency.exponentialRampToValueAtTime(75, now + 0.16);
      gain.gain.setValueAtTime(0.28, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.start(now); osc.stop(now + 0.17);
    } else if (type === 'hit') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(170, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'dash') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.18);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now); osc.stop(now + 0.19);
    } else if (type === 'bomb') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(24, now + 0.45);
      gain.gain.setValueAtTime(0.45, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.start(now); osc.stop(now + 0.46);
    } else if (type === 'heal') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.setValueAtTime(660, now + 0.09);
      osc.frequency.setValueAtTime(880, now + 0.18);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now); osc.stop(now + 0.31);
    } else if (type === 'item') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(587, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      osc.start(now); osc.stop(now + 0.23);
    } else if (type === 'shieldBreak') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(920, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.24);
      gain.gain.setValueAtTime(0.26, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'ko') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(260, now);
      osc.frequency.exponentialRampToValueAtTime(35, now + 0.55);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
      osc.start(now); osc.stop(now + 0.56);
    } else if (type === 'chat') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(740, now);
      osc.frequency.setValueAtTime(980, now + 0.06);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.start(now); osc.stop(now + 0.16);
    }
  }
}
const sfx = new SoundFX();

/* =========================================================
   3. ゲーム定数 & 状態管理
   ========================================================= */
const MAP_SIZE = 1500;
const MATCH_TIME = 300; // 5分 (300秒)
const COLORS = [
  { main: '#00f3ff', glow: 'rgba(0, 243, 255, 0.55)' },
  { main: '#ff007f', glow: 'rgba(255, 0, 127, 0.55)' },
  { main: '#39ff14', glow: 'rgba(57, 255, 20, 0.55)' },
  { main: '#ffd700', glow: 'rgba(255, 215, 0, 0.55)' },
  { main: '#c77dff', glow: 'rgba(199, 125, 255, 0.55)' }
];
const ITEM_SPECS = [
  { type: 'bomb', label: '爆弾', icon: '💣', color: '#ff3b30' },
  { type: 'heal', label: '回復', icon: '💚', color: '#39ff14' },
  { type: 'thunder', label: '雷', icon: '⚡', color: '#ffd700' },
  { type: 'shield', label: 'シールド', icon: '🛡️', color: '#00f3ff' },
  { type: 'trap', label: '罠', icon: '🕸️', color: '#c77dff' },
  { type: 'sword', label: '強化剣', icon: '⚔️', color: '#ff9500' }
];

let myId = 'local_p1';
let isHost = true;
let isSolo = false;
let roomCode = '';
let peer = null;
let conns = []; // ホスト用: クライアント接続リスト
let hostConn = null; // クライアント用: ホスト接続

let gameState = {
  phase: 'title', // title | lobby | playing | ended
  timeLeft: MATCH_TIME,
  zoneRadius: MAP_SIZE * 0.72,
  players: [],
  items: [],
  traps: [],
  effects: [],
  winner: null
};

let shakeTimer = 0;
let itemSpawnTimer = 1;
let zoneDmgTimer = 1;

/* =========================================================
   4. P2P オンライン通信 (PeerJS) & ロビー制御
   ========================================================= */
const PEER_PREFIX = 'volt-arena-room-2026-';

function getMyName() {
  const val = document.getElementById('playerNameInput').value.trim();
  return val || 'VOLT_' + Math.floor(10 + Math.random() * 89);
}

function showScreen(id) {
  ['titleScreen', 'lobbyScreen', 'resultScreen', 'hud'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

function addFeed(html, borderColor = '#00f3ff') {
  const area = document.getElementById('feedArea');
  const div = document.createElement('div');
  div.className = 'feed-item';
  div.style.borderLeftColor = borderColor;
  div.innerHTML = html;
  area.appendChild(div);
  while (area.children.length > 5) area.removeChild(area.firstChild);
  setTimeout(() => { if (div.parentNode) div.remove(); }, 4500);
}

// 1人練習モード
document.getElementById('btnSolo').onclick = () => {
  sfx.unlock();
  isHost = true;
  isSolo = true;
  myId = 'player_0';
  gameState.players = [makePlayer(myId, getMyName(), 0, false)];
  startMatch(true);
};

// オンライン部屋作成
document.getElementById('btnCreate').onclick = () => {
  sfx.unlock();
  const status = document.getElementById('titleStatus');
  status.textContent = '部屋を作成中...';
  isHost = true;
  isSolo = false;
  conns = [];
  roomCode = Math.floor(100 + Math.random() * 900).toString();

  if (peer) peer.destroy();
  peer = new Peer(PEER_PREFIX + roomCode);

  peer.on('open', (id) => {
    myId = id;
    gameState.phase = 'lobby';
    gameState.players = [makePlayer(myId, getMyName(), 0, false)];
    status.textContent = '';
    openLobby();
  });

  peer.on('connection', (conn) => {
    conn.on('data', (msg) => handleHostReceive(conn, msg));
    conn.on('close', () => {
      conns = conns.filter(c => c !== conn);
      gameState.players = gameState.players.filter(p => p.id !== conn.peer);
      broadcastLobby();
    });
  });

  peer.on('error', () => {
    status.textContent = '通信エラーが発生しました。もう一度お試しください。';
  });
};

// オンライン部屋参加
document.getElementById('btnJoin').onclick = () => {
  sfx.unlock();
  const code = document.getElementById('roomCodeInput').value.trim();
  const status = document.getElementById('titleStatus');
  if (!/^\d{3}$/.test(code)) {
    status.textContent = '3桁の半角数字を入力してください';
    return;
  }
  status.textContent = `部屋 ${code} に接続中...`;
  isHost = false;
  isSolo = false;
  roomCode = code;

  if (peer) peer.destroy();
  peer = new Peer();
  peer.on('open', (id) => {
    myId = id;
    hostConn = peer.connect(PEER_PREFIX + code, { reliable: true });
    hostConn.on('open', () => {
      hostConn.send({ type: 'join', name: getMyName() });
    });
    hostConn.on('data', (msg) => handleClientReceive(msg));
    hostConn.on('close', () => {
      alert('ホストとの接続が切れました');
      location.reload();
    });
  });
  peer.on('error', () => {
    status.textContent = '部屋が見つからないか満員です';
  });
};

function handleHostReceive(conn, msg) {
  if (msg.type === 'join') {
    if (gameState.phase !== 'lobby' || gameState.players.length >= 5) {
      conn.send({ type: 'reject', reason: '満員または試合中です' });
      return;
    }
    conns.push(conn);
    gameState.players.push(makePlayer(conn.peer, msg.name, gameState.players.length, false));
    broadcastLobby();
  } else if (msg.type === 'input') {
    const p = gameState.players.find(pl => pl.id === conn.peer);
    if (p && p.alive) {
      p.vx = msg.vx; p.vy = msg.vy; p.angle = msg.angle;
    }
  } else if (msg.type === 'action') {
    const p = gameState.players.find(pl => pl.id === conn.peer);
    if (p && p.alive) triggerAction(p, msg.act);
  } else if (msg.type === 'chat') {
    const p = gameState.players.find(pl => pl.id === conn.peer);
    if (p) applyChat(p, msg.text);
  }
}

function handleClientReceive(msg) {
  if (msg.type === 'reject') {
    document.getElementById('titleStatus').textContent = msg.reason;
  } else if (msg.type === 'lobby') {
    gameState.phase = 'lobby';
    gameState.players = msg.players;
    openLobby();
  } else if (msg.type === 'start') {
    gameState.phase = 'playing';
    showScreen('hud');
  } else if (msg.type === 'state') {
    gameState = msg.state;
    updateHud();
  } else if (msg.type === 'sfx') {
    sfx.play(msg.name);
    if (msg.name === 'hit' || msg.name === 'bomb') shakeTimer = 0.16;
  } else if (msg.type === 'feed') {
    addFeed(msg.html, msg.color);
  } else if (msg.type === 'end') {
    gameState = msg.state;
    openResult();
  }
}

function broadcastAll(payload) {
  conns.forEach(c => { if (c.open) c.send(payload); });
}

function broadcastLobby() {
  openLobby();
  broadcastAll({ type: 'lobby', players: gameState.players });
}

function openLobby() {
  showScreen('lobbyScreen');
  document.getElementById('lobbyCode').textContent = roomCode;
  const list = document.getElementById('lobbyPlayers');
  list.innerHTML = gameState.players.map((p, i) => `
    <div class="player-item">
      <span><i class="dot" style="background:${p.color.main};box-shadow:0 0 8px ${p.color.main};"></i>${escapeHtml(p.name)}</span>
      <span style="font-size:11px;color:#8ab4f8;">${i === 0 ? 'HOST' : 'READY'}</span>
    </div>
  `).join('');

  const b4 = document.getElementById('btnStart4');
  const bBot = document.getElementById('btnStartBot');
  const wait = document.getElementById('lobbyWaitMsg');
  if (isHost) {
    wait.classList.add('hidden');
    bBot.classList.remove('hidden');
    b4.classList.toggle('hidden', gameState.players.length < 4);
  } else {
    b4.classList.add('hidden');
    bBot.classList.add('hidden');
    wait.classList.remove('hidden');
  }
}

document.getElementById('btnStart4').onclick = () => startMatch(false);
document.getElementById('btnStartBot').onclick = () => startMatch(true);
document.getElementById('btnRematch').onclick = () => {
  if (isHost) startMatch(isSolo || gameState.players.some(p => p.isBot));
};
document.getElementById('btnBackTitle').onclick = () => location.reload();

/* =========================================================
   5. ゲームロジック（ホスト権威シミュレーション）
   ========================================================= */
function makePlayer(id, name, colorIdx, isBot) {
  const pad = 260;
  return {
    id, name, isBot,
    color: COLORS[colorIdx % COLORS.length],
    x: pad + Math.random() * (MAP_SIZE - pad * 2),
    y: pad + Math.random() * (MAP_SIZE - pad * 2),
    vx: 0, vy: 0, angle: 0,
    hp: 100, maxHp: 100, alive: true,
    atkCd: 0, dashCd: 0, dashTimer: 0,
    speedTimer: 0, stunTimer: 0,
    shield: false, poweredSword: false,
    emote: '', emoteTimer: 0,
    kills: 0, aiTimer: 0
  };
}

function startMatch(fillBots) {
  const humans = gameState.players.filter(p => !p.isBot);
  gameState.players = humans.map((p, idx) => makePlayer(p.id, p.name, idx, false));

  if (fillBots) {
    const botNames = ['VOLT-X', 'CYBER', 'NOVA', 'VIPER', 'ZERO'];
    while (gameState.players.length < 5) {
      const idx = gameState.players.length;
      gameState.players.push(makePlayer('bot_' + idx, botNames[idx] + '(CPU)', idx, true));
    }
  }

  gameState.phase = 'playing';
  gameState.timeLeft = MATCH_TIME;
  gameState.zoneRadius = MAP_SIZE * 0.72;
  gameState.items = [];
  gameState.traps = [];
  gameState.effects = [];
  gameState.winner = null;
  itemSpawnTimer = 1.0;
  zoneDmgTimer = 1.0;

  for (let i = 0; i < 9; i++) spawnItem();

  showScreen('hud');
  broadcastAll({ type: 'start' });
  sendFeed('⚡ バトル開始！同盟も裏切りも自由！', '#00f3ff');
}

function spawnItem() {
  if (gameState.items.length >= 18) return;
  const elapsed = MATCH_TIME - gameState.timeLeft;
  // 3:30以降は回復アイテムを出現停止
  const pool = elapsed >= 210 ? ITEM_SPECS.filter(i => i.type !== 'heal') : ITEM_SPECS;
  const spec = pool[Math.floor(Math.random() * pool.length)];
  const maxR = gameState.zoneRadius * 0.85;
  const a = Math.random() * Math.PI * 2;
  const d = Math.sqrt(Math.random()) * maxR;

  gameState.items.push({
    id: Math.random().toString(36).slice(2, 8),
    ...spec,
    x: MAP_SIZE / 2 + Math.cos(a) * d,
    y: MAP_SIZE / 2 + Math.sin(a) * d
  });
}

function playAndBroadcastSfx(name) {
  sfx.play(name);
  if (name === 'hit' || name === 'bomb') shakeTimer = 0.16;
  broadcastAll({ type: 'sfx', name });
}

function sendFeed(html, color = '#00f3ff') {
  addFeed(html, color);
  broadcastAll({ type: 'feed', html, color });
}

function applyChat(p, text) {
  p.emote = text;
  p.emoteTimer = 3.5;
  playAndBroadcastSfx('chat');
  sendFeed(`<b style="color:${p.color.main}">${escapeHtml(p.name)}</b>: ${escapeHtml(text)}`, p.color.main);
}

function triggerAction(p, act) {
  if (!p.alive || p.stunTimer > 0) return;
  if (act === 'attack' && p.atkCd <= 0) {
    p.atkCd = 0.7;
    const dmg = p.poweredSword ? 40 : 20;
    const powered = p.poweredSword;
    p.poweredSword = false;

    gameState.effects.push({
      type: 'slash', x: p.x, y: p.y, angle: p.angle,
      color: powered ? '#ff9500' : p.color.main, powered, ttl: 0.22
    });
    playAndBroadcastSfx(powered ? 'powerSlash' : 'slash');

    const range = 115; // 前方約2マス
    let hit = false;
    for (const t of gameState.players) {
      if (t.id === p.id || !t.alive || t.dashTimer > 0) continue;
      const dx = t.x - p.x, dy = t.y - p.y;
      if (Math.hypot(dx, dy) <= range + 24) {
        let diff = Math.abs(Math.atan2(dy, dx) - p.angle);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff <= 0.98) {
          hit = true;
          damagePlayer(p, t, dmg);
        }
      }
    }
    if (hit) playAndBroadcastSfx('hit');
  } else if (act === 'dash' && p.dashCd <= 0) {
    p.dashTimer = 0.5;
    p.dashCd = 3.0;
    gameState.effects.push({ type: 'dash', x: p.x, y: p.y, angle: p.angle, color: p.color.main, ttl: 0.3 });
    playAndBroadcastSfx('dash');
  }
}

function damagePlayer(attacker, target, amount) {
  if (!target.alive) return;
  if (target.shield) {
    target.shield = false;
    gameState.effects.push({ type: 'ring', x: target.x, y: target.y, color: '#00f3ff', ttl: 0.4 });
    playAndBroadcastSfx('shieldBreak');
    return;
  }
  target.hp = Math.max(0, target.hp - amount);
  gameState.effects.push({ type: 'text', x: target.x, y: target.y - 26, text: `-${amount}`, color: '#ff3b30', ttl: 0.7 });

  if (target.hp <= 0) {
    target.alive = false;
    if (attacker) attacker.kills++;
    gameState.effects.push({ type: 'ring', x: target.x, y: target.y, color: target.color.main, ttl: 0.7 });
    playAndBroadcastSfx('ko');
    const killerName = attacker ? attacker.name : '危険エリア';
    sendFeed(`💀 <b>${escapeHtml(killerName)}</b> が <b>${escapeHtml(target.name)}</b> を撃破！`, '#ff007f');
  }
}

function pickupItem(p, item) {
  if (item.type === 'bomb') {
    playAndBroadcastSfx('bomb');
    gameState.effects.push({ type: 'bomb', x: p.x, y: p.y, ttl: 0.45 });
    for (const t of gameState.players) {
      if (t.id === p.id || !t.alive || t.dashTimer > 0) continue;
      if (Math.hypot(t.x - p.x, t.y - p.y) <= 175) {
        damagePlayer(p, t, 40);
      }
    }
  } else if (item.type === 'heal') {
    p.hp = Math.min(100, p.hp + 30);
    playAndBroadcastSfx('heal');
    gameState.effects.push({ type: 'text', x: p.x, y: p.y - 26, text: '+30', color: '#39ff14', ttl: 0.7 });
  } else if (item.type === 'thunder') {
    p.speedTimer = 2.0;
    playAndBroadcastSfx('item');
  } else if (item.type === 'shield') {
    p.shield = true;
    playAndBroadcastSfx('item');
  } else if (item.type === 'trap') {
    gameState.traps.push({ ownerId: p.id, x: p.x, y: p.y, color: p.color.main });
    playAndBroadcastSfx('item');
  } else if (item.type === 'sword') {
    p.poweredSword = true;
    playAndBroadcastSfx('item');
  }
}

function updateBot(bot, dt) {
  bot.aiTimer -= dt;
  const cx = MAP_SIZE / 2, cy = MAP_SIZE / 2;
  const distCenter = Math.hypot(bot.x - cx, bot.y - cy);

  // エリア外に近づいたら中央へ戻る
  if (distCenter > gameState.zoneRadius * 0.82) {
    const a = Math.atan2(cy - bot.y, cx - bot.x);
    bot.vx = Math.cos(a); bot.vy = Math.sin(a); bot.angle = a;
    return;
  }

  // 一番近い敵を探す
  let nearest = null, minD = Infinity;
  for (const other of gameState.players) {
    if (other.id === bot.id || !other.alive) continue;
    const d = Math.hypot(other.x - bot.x, other.y - bot.y);
    if (d < minD) { minD = d; nearest = other; }
  }

  // 近くにアイテムがあれば優先取得
  let nearItem = null, minItemD = 260;
  for (const it of gameState.items) {
    const d = Math.hypot(it.x - bot.x, it.y - bot.y);
    if (d < minItemD) { minItemD = d; nearItem = it; }
  }

  if (nearItem && (!nearest || minD > 160)) {
    const a = Math.atan2(nearItem.y - bot.y, nearItem.x - bot.x);
    bot.vx = Math.cos(a); bot.vy = Math.sin(a); bot.angle = a;
  } else if (nearest) {
    const a = Math.atan2(nearest.y - bot.y, nearest.x - bot.x);
    bot.angle = a;
    if (minD > 95) {
      bot.vx = Math.cos(a); bot.vy = Math.sin(a);
    } else {
      bot.vx = Math.cos(a + Math.PI / 2) * 0.6;
      bot.vy = Math.sin(a + Math.PI / 2) * 0.6;
      if (bot.atkCd <= 0) triggerAction(bot, 'attack');
    }
    if (minD < 140 && bot.dashCd <= 0 && Math.random() < 0.02) {
      triggerAction(bot, 'dash');
    }
  }
}

function stepSimulation(dt) {
  if (!isHost || gameState.phase !== 'playing') return;

  const prevTime = gameState.timeLeft;
  gameState.timeLeft = Math.max(0, gameState.timeLeft - dt);
  const elapsed = MATCH_TIME - gameState.timeLeft;

  // 時間経過イベント通知
  if (prevTime > 240 && gameState.timeLeft <= 240) sendFeed('⚡ 1:00経過！アイテム大量出現！', '#ffd700');
  if (prevTime > 180 && gameState.timeLeft <= 180) sendFeed('⚠️ 2:00経過！危険エリア縮小開始！', '#ff3b30');
  if (prevTime > 90 && gameState.timeLeft <= 90) sendFeed('🔥 3:30経過！最終エリア＆回復停止！', '#ff007f');

  // エリア縮小
  if (elapsed >= 210) {
    gameState.zoneRadius = Math.max(180, gameState.zoneRadius - 20 * dt);
  } else if (elapsed >= 120) {
    gameState.zoneRadius = Math.max(400, gameState.zoneRadius - 17 * dt);
  }

  // アイテム生成
  itemSpawnTimer -= dt;
  if (itemSpawnTimer <= 0) {
    spawnItem();
    itemSpawnTimer = elapsed >= 60 ? 2.0 : 4.0;
  }

  // エリア外ダメージ（1秒毎）
  zoneDmgTimer -= dt;
  const doZoneDmg = zoneDmgTimer <= 0;
  if (doZoneDmg) zoneDmgTimer = 1.0;

  for (const p of gameState.players) {
    if (p.emoteTimer > 0) {
      p.emoteTimer -= dt;
      if (p.emoteTimer <= 0) p.emote = '';
    }
    if (!p.alive) continue;

    if (p.atkCd > 0) p.atkCd = Math.max(0, p.atkCd - dt);
    if (p.dashCd > 0) p.dashCd = Math.max(0, p.dashCd - dt);
    if (p.dashTimer > 0) p.dashTimer = Math.max(0, p.dashTimer - dt);
    if (p.speedTimer > 0) p.speedTimer = Math.max(0, p.speedTimer - dt);
    if (p.stunTimer > 0) p.stunTimer = Math.max(0, p.stunTimer - dt);

    if (p.isBot && p.stunTimer <= 0) updateBot(p, dt);

    if (p.stunTimer <= 0) {
      let spd = 255;
      if (p.speedTimer > 0) spd *= 2.0;
      if (p.dashTimer > 0) spd *= 2.4;
      p.x = Math.max(28, Math.min(MAP_SIZE - 28, p.x + p.vx * spd * dt));
      p.y = Math.max(28, Math.min(MAP_SIZE - 28, p.y + p.vy * spd * dt));
    }

    if (doZoneDmg) {
      if (Math.hypot(p.x - MAP_SIZE / 2, p.y - MAP_SIZE / 2) > gameState.zoneRadius) {
        damagePlayer(null, p, 5);
      }
    }

    // 罠判定
    for (let i = gameState.traps.length - 1; i >= 0; i--) {
      const tr = gameState.traps[i];
      if (tr.ownerId === p.id) continue;
      if (Math.hypot(p.x - tr.x, p.y - tr.y) < 36) {
        p.stunTimer = 1.0;
        gameState.effects.push({ type: 'text', x: p.x, y: p.y - 24, text: 'STOP!', color: '#c77dff', ttl: 1.0 });
        playAndBroadcastSfx('shieldBreak');
        gameState.traps.splice(i, 1);
        break;
      }
    }

    // アイテム取得
    for (let i = gameState.items.length - 1; i >= 0; i--) {
      const it = gameState.items[i];
      if (Math.hypot(p.x - it.x, p.y - it.y) < 42) {
        pickupItem(p, it);
        gameState.items.splice(i, 1);
      }
    }
  }

  for (let i = gameState.effects.length - 1; i >= 0; i--) {
    gameState.effects[i].ttl -= dt;
    if (gameState.effects[i].ttl <= 0) gameState.effects.splice(i, 1);
  }

  // 勝敗判定
  const alive = gameState.players.filter(p => p.alive);
  if (alive.length <= 1 || gameState.timeLeft <= 0) {
    gameState.phase = 'ended';
    let win = alive[0] || gameState.players[0];
    if (alive.length > 1) {
      alive.sort((a, b) => b.hp - a.hp);
      win = alive[0];
    }
    gameState.winner = win;
    broadcastAll({ type: 'end', state: gameState });
    openResult();
    return;
  }

  updateHud();
  broadcastAll({ type: 'state', state: gameState });
}

function openResult() {
  showScreen('resultScreen');
  const w = gameState.winner;
  document.getElementById('winnerText').textContent = `👑 WINNER: ${w ? w.name : 'DRAW'}`;
  const sorted = [...gameState.players].sort((a, b) => (b.alive - a.alive) || (b.hp - a.hp) || (b.kills - a.kills));
  document.getElementById('resultStats').innerHTML = sorted.map((p, i) =>
    `<div>${i + 1}位: <b style="color:${p.color.main}">${escapeHtml(p.name)}</b> (残HP: ${p.hp} / 撃破: ${p.kills})</div>`
  ).join('');
  document.getElementById('btnRematch').classList.toggle('hidden', !isHost);
}

/* =========================================================
   6. 入力制御（PCキーボード + スマホマルチタッチ仮想スティック）
   ========================================================= */
const keys = {};
let stickVec = { x: 0, y: 0 };
let stickTouchId = null;
let stickOrigin = { x: 0, y: 0 };

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (gameState.phase !== 'playing') return;
  if (e.code === 'Space') sendAction('attack');
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') sendAction('dash');
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

const stickZone = document.getElementById('stickZone');
stickZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  stickTouchId = t.identifier;
  stickOrigin = { x: t.clientX, y: t.clientY };
});
stickZone.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === stickTouchId) {
      const dx = t.clientX - stickOrigin.x;
      const dy = t.clientY - stickOrigin.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 46;
      if (dist > 6) {
        const clamped = Math.min(dist, maxR) / maxR;
        stickVec.x = (dx / dist) * clamped;
        stickVec.y = (dy / dist) * clamped;
      } else {
        stickVec.x = 0; stickVec.y = 0;
      }
    }
  }
});
const endStick = (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === stickTouchId) {
      stickTouchId = null;
      stickVec.x = 0; stickVec.y = 0;
    }
  }
};
stickZone.addEventListener('touchend', endStick);
stickZone.addEventListener('touchcancel', endStick);

document.getElementById('btnAtk').addEventListener('touchstart', (e) => { e.preventDefault(); sendAction('attack'); });
document.getElementById('btnAtk').addEventListener('mousedown', () => sendAction('attack'));
document.getElementById('btnDash').addEventListener('touchstart', (e) => { e.preventDefault(); sendAction('dash'); });
document.getElementById('btnDash').addEventListener('mousedown', () => sendAction('dash'));

document.querySelectorAll('.chat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const text = btn.dataset.chat;
    if (isHost) {
      const me = gameState.players.find(p => p.id === myId);
      if (me) applyChat(me, text);
    } else if (hostConn && hostConn.open) {
      hostConn.send({ type: 'chat', text });
    }
  });
});

function sendAction(act) {
  if (gameState.phase !== 'playing') return;
  if (isHost) {
    const me = gameState.players.find(p => p.id === myId);
    if (me) triggerAction(me, act);
  } else if (hostConn && hostConn.open) {
    hostConn.send({ type: 'action', act });
  }
}

function processLocalInput() {
  if (gameState.phase !== 'playing') return;
  let vx = stickVec.x, vy = stickVec.y;
  if (keys['KeyW'] || keys['ArrowUp']) vy -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) vy += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) vx += 1;

  const len = Math.hypot(vx, vy);
  if (len > 1) { vx /= len; vy /= len; }

  const me = gameState.players.find(p => p.id === myId);
  if (!me) return;
  const angle = len > 0.05 ? Math.atan2(vy, vx) : me.angle;

  if (isHost) {
    me.vx = vx; me.vy = vy; me.angle = angle;
  } else if (hostConn && hostConn.open) {
    hostConn.send({ type: 'input', vx, vy, angle });
  }
}

/* =========================================================
   7. HUD & サイバーネオン Canvas 描画
   ========================================================= */
function updateHud() {
  const me = gameState.players.find(p => p.id === myId);
  const aliveCount = gameState.players.filter(p => p.alive).length;
  document.getElementById('hudAlive').textContent = `${aliveCount} / ${gameState.players.length}`;

  const m = Math.floor(gameState.timeLeft / 60).toString().padStart(2, '0');
  const s = Math.floor(gameState.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('hudTimer').textContent = `${m}:${s}`;

  const elapsed = MATCH_TIME - gameState.timeLeft;
  const phaseEl = document.getElementById('hudPhase');
  if (elapsed >= 210) { phaseEl.textContent = '🔥 最終エリア（回復停止）'; phaseEl.style.color = '#ff007f'; }
  else if (elapsed >= 120) { phaseEl.textContent = '⚠️ 危険エリア縮小中'; phaseEl.style.color = '#ff3b30'; }
  else if (elapsed >= 60) { phaseEl.textContent = '⚡ アイテム大量出現'; phaseEl.style.color = '#ffd700'; }
  else { phaseEl.textContent = '通常フェーズ'; phaseEl.style.color = '#c77dff'; }

  if (!me) return;
  document.getElementById('hudName').textContent = me.name;
  document.getElementById('hudHpText').textContent = `${me.hp} / 100`;
  document.getElementById('hudHpBar').style.width = `${me.hp}%`;

  const buffs = [];
  if (me.shield) buffs.push('<span class="buff-tag" style="color:#00f3ff;">🛡️ シールド</span>');
  if (me.poweredSword) buffs.push('<span class="buff-tag" style="color:#ff9500;">⚔️ 強化剣(40)</span>');
  if (me.speedTimer > 0) buffs.push('<span class="buff-tag" style="color:#ffd700;">⚡ 2倍速</span>');
  if (me.stunTimer > 0) buffs.push('<span class="buff-tag" style="color:#ff3b30;">🕸️ 停止中</span>');
  document.getElementById('hudBuffs').innerHTML = buffs.join('');

  const atkMask = document.getElementById('atkCdMask');
  if (me.atkCd > 0) { atkMask.classList.remove('hidden'); atkMask.textContent = me.atkCd.toFixed(1); }
  else atkMask.classList.add('hidden');

  const dashMask = document.getElementById('dashCdMask');
  if (me.dashCd > 0) { dashMask.classList.remove('hidden'); dashMask.textContent = me.dashCd.toFixed(1); }
  else dashMask.classList.add('hidden');
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth * devicePixelRatio;
  canvas.height = window.innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function render() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  ctx.fillStyle = '#060711';
  ctx.fillRect(0, 0, w, h);

  const me = gameState.players.find(p => p.id === myId) || gameState.players[0];
  let camX = MAP_SIZE / 2, camY = MAP_SIZE / 2;
  if (me) { camX = me.x; camY = me.y; }

  ctx.save();
  let sx = 0, sy = 0;
  if (shakeTimer > 0) {
    sx = (Math.random() - 0.5) * 12;
    sy = (Math.random() - 0.5) * 12;
  }
  ctx.translate(w / 2 - camX + sx, h / 2 - camY + sy);

  // サイバーグリッド床
  ctx.strokeStyle = 'rgba(0, 243, 255, 0.08)';
  ctx.lineWidth = 1;
  const grid = 60;
  for (let x = 0; x <= MAP_SIZE; x += grid) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
  }
  for (let y = 0; y <= MAP_SIZE; y += grid) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
  }

  // 外周フレーム
  ctx.strokeStyle = '#7b2cbf';
  ctx.lineWidth = 6;
  ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);

  // 危険エリア（安全圏リング）
  ctx.save();
  ctx.beginPath();
  ctx.arc(MAP_SIZE / 2, MAP_SIZE / 2, gameState.zoneRadius, 0, Math.PI * 2);
  ctx.strokeStyle = '#ff007f';
  ctx.lineWidth = 5;
  ctx.shadowColor = '#ff007f';
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.restore();

  // 設置された罠
  for (const tr of gameState.traps) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, 22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(199, 125, 255, 0.5)';
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  // アイテム描画
  const pulse = 1 + Math.sin(performance.now() / 160) * 0.1;
  for (const it of gameState.items) {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(pulse, pulse);
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(10, 14, 34, 0.9)';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = it.color;
    ctx.shadowColor = it.color;
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.icon, 0, 1);
    ctx.restore();
  }

  // プレイヤー描画
  for (const p of gameState.players) {
    if (!p.alive) continue;
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.dashTimer > 0) ctx.globalAlpha = 0.45;

    // 攻撃方向インジケーター
    ctx.save();
    ctx.rotate(p.angle);
    ctx.beginPath();
    ctx.moveTo(28, 0);
    ctx.lineTo(18, -8);
    ctx.lineTo(18, 8);
    ctx.closePath();
    ctx.fillStyle = p.poweredSword ? '#ff9500' : p.color.main;
    ctx.fill();
    ctx.restore();

    // シールドバリア
    if (p.shield) {
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // 本体サークル
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fillStyle = '#0b0f26';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = p.color.main;
    ctx.shadowColor = p.color.main;
    ctx.shadowBlur = 18;
    ctx.stroke();

    // 名前とミニHPバー
    ctx.shadowBlur = 0;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(p.name, 0, -36);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-22, -31, 44, 5);
    ctx.fillStyle = p.hp > 35 ? '#39ff14' : '#ff3b30';
    ctx.fillRect(-22, -31, 44 * (p.hp / 100), 5);

    // 同盟・裏切りチャット吹き出し
    if (p.emote) {
      ctx.font = 'bold 12px sans-serif';
      const tw = ctx.measureText(p.emote).width + 16;
      ctx.fillStyle = 'rgba(18, 10, 42, 0.92)';
      ctx.strokeStyle = p.color.main;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(-tw / 2, -66, tw, 22, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillText(p.emote, 0, -51);
    }

    ctx.restore();
  }

  // バトルエフェクト描画
  for (const ef of gameState.effects) {
    ctx.save();
    if (ef.type === 'slash') {
      ctx.translate(ef.x, ef.y);
      ctx.rotate(ef.angle);
      ctx.beginPath();
      ctx.arc(0, 0, ef.powered ? 120 : 105, -0.95, 0.95);
      ctx.strokeStyle = ef.color;
      ctx.lineWidth = ef.powered ? 16 : 10;
      ctx.shadowColor = ef.color;
      ctx.shadowBlur = 20;
      ctx.stroke();
    } else if (ef.type === 'bomb') {
      ctx.beginPath();
      ctx.arc(ef.x, ef.y, 175 * (1 - ef.ttl / 0.45), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 59, 48, 0.35)';
      ctx.fill();
      ctx.strokeStyle = '#ff9500';
      ctx.lineWidth = 4;
      ctx.stroke();
    } else if (ef.type === 'ring' || ef.type === 'dash') {
      ctx.beginPath();
      ctx.arc(ef.x, ef.y, 48 * (1 - ef.ttl), 0, Math.PI * 2);
      ctx.strokeStyle = ef.color;
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if (ef.type === 'text') {
      ctx.font = '900 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = ef.color;
      ctx.fillText(ef.text, ef.x, ef.y - (1 - ef.ttl) * 28);
    }
    ctx.restore();
  }

  ctx.restore();

  // 仮想スティックの視覚ガイド
  if (stickTouchId !== null) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(stickOrigin.x, stickOrigin.y, 46, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.45)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(stickOrigin.x + stickVec.x * 46, stickOrigin.y + stickVec.y * 46, 20, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 243, 255, 0.65)';
    ctx.fill();
    ctx.restore();
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
}

// メインループ
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
  processLocalInput();
  stepSimulation(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
