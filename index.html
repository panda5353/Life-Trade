<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Live or Die (LoD) ver0.4 Real Monster Edition</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      overflow: hidden;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* YouTube BGM Iframe */
    #bgm-container {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -9999px;
      top: -9999px;
      overflow: hidden;
      pointer-events: none;
    }

    /* 除細動器・死亡オーバーレイ */
    #resus-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s ease;
    }
    #resus-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .resus-text {
      color: #00ffcc;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #00ffcc;
      animation: blink 0.25s infinite alternate;
    }
    .death-text {
      color: #ff0000;
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-shadow: 0 0 40px #ff0000;
    }
    @keyframes blink {
      0% { opacity: 0.15; }
      100% { opacity: 1; }
    }

    /* タイトル画面 */
    #title-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: flex;
      background: rgba(5, 5, 5, 0.95);
      transition: opacity 0.8s ease;
    }

    .left-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 2px solid #222;
      padding: 40px;
      background: radial-gradient(circle, #2a0000 0%, #000 85%);
    }

    .title-logo {
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-align: center;
      line-height: 1.2;
      color: #eee;
    }

    .lod-highlight {
      color: #ff0000;
      font-size: 4.8rem;
      text-shadow: 0 0 25px #ff0000;
      display: inline-block;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    .right-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      background: #080808;
    }

    .join-box {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .code-input {
      width: 100%;
      padding: 15px;
      background: #111;
      border: 2px solid #333;
      color: #ff0000;
      font-size: 2rem;
      text-align: center;
      letter-spacing: 8px;
      font-family: monospace;
      border-radius: 4px;
      outline: none;
    }
    .code-input:focus {
      border-color: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
    }

    .btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
      transition: all 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      box-shadow: none;
    }

    .status-msg {
      margin-top: 10px;
      color: #ffcc00;
      font-size: 0.9rem;
      text-align: center;
      min-height: 20px;
    }

    /* HUD UI */
    #game-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .player-card {
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid #333;
      padding: 12px 20px;
      border-radius: 6px;
      min-width: 200px;
    }

    .player-name {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 5px;
    }

    .health-bar {
      display: flex;
      gap: 6px;
    }

    .hp-node {
      width: 20px;
      height: 20px;
      background: #ff0000;
      box-shadow: 0 0 10px #ff0000;
      border-radius: 50%;
    }
    .hp-node.empty {
      background: #222;
      box-shadow: none;
    }

    .shell-counter {
      background: rgba(0,0,0,0.85);
      border: 1px solid #444;
      padding: 8px 18px;
      border-radius: 20px;
      color: #ffcc00;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .hud-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .action-controls {
      display: flex;
      gap: 15px;
    }

    .act-btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #ff0000;
      background: rgba(200, 0, 0, 0.2);
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .act-btn:hover:not(:disabled) {
      background: #ff0000;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
    }
    .act-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #444;
      background: rgba(30,30,30,0.4);
    }

    .turn-banner {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      font-weight: 900;
      color: #ff0000;
      text-shadow: 0 0 20px #000;
      letter-spacing: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
      text-align: center;
    }

    #orient-warning {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    @media (orientation: portrait) {
      #orient-warning { display: flex; }
    }
  </style>
</head>
<body>

  <!-- 横画面推奨 -->
  <div id="orient-warning">
    <div style="font-size: 3rem; margin-bottom: 10px;">🔄</div>
    <h2>画面を横向きにしてください</h2>
  </div>

  <!-- 除細動器・死亡オーバーレイ -->
  <div id="resus-overlay">
    <div id="resus-title" class="resus-text">⚡ CLEAR! ⚡</div>
    <div style="color: #aaa; margin-top: 15px; font-size: 1.1rem;" id="resus-sub">除細動器起動中...</div>
  </div>

  <!-- YouTube BGM -->
  <div id="bgm-container">
    <iframe id="youtube-bgm" width="100" height="100" src="https://www.youtube.com/embed/lRjJk4xhHHE?enablejsapi=1&autoplay=1&loop=1&playlist=lRjJk4xhHHE" frameborder="0" allow="autoplay"></iframe>
  </div>

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="left-half">
      <div class="title-logo">
        <span class="lod-highlight">L</span>IVE <span class="lod-highlight">o</span>r <span class="lod-highlight">D</span>IE
      </div>
      <div style="color:#666; margin-top:15px; letter-spacing:2px;">ver0.4 REAL MONSTER EDITION</div>
    </div>
    <div class="right-half">
      <div class="join-box">
        <div style="color:#888; font-size:0.85rem;">3桁の部屋コード</div>
        <input type="text" id="roomCode" class="code-input" placeholder="777" maxlength="3" pattern="[0-9]*" inputmode="numeric">
        <button id="btn-join" class="btn">対戦を始める / 作成</button>
        <button id="btn-ai" class="btn btn-secondary">VS AI（1人プレイ）</button>
        <div id="status-msg" class="status-msg"></div>
      </div>
    </div>
  </div>

  <!-- ゲームUI -->
  <div id="game-ui" style="display: none;">
    <div class="hud-top">
      <div class="player-card">
        <div class="player-name">MONSTER 2 (OPPONENT)</div>
        <div id="opp-hp" class="health-bar"></div>
      </div>
      <div class="shell-counter">
        残弾: <span id="live-count" style="color:#ff3333; font-weight:bold;">?</span> 実弾 / <span id="blank-count" style="color:#aaa; font-weight:bold;">?</span> 空砲
      </div>
      <div class="player-card">
        <div class="player-name">MONSTER 1 (YOU)</div>
        <div id="my-hp" class="health-bar"></div>
      </div>
    </div>

    <div id="turn-banner" class="turn-banner">YOUR TURN</div>

    <div class="hud-bottom">
      <div class="action-controls">
        <button id="btn-shoot-opp" class="act-btn">相手を撃つ</button>
        <button id="btn-shoot-self" class="act-btn" style="border-color: #888; background: rgba(50,50,50,0.5);">自分を撃つ</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
    // --- 1. Sound Engine (Synthesizer & Real Item SEs) ---
    class SoundEngine {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      resume() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      // 実弾：「バン！」
      playBang() {
        this.resume();
        const now = this.ctx.currentTime;
        const bufSize = this.ctx.sampleRate * 0.6;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1500, now);
        filter.frequency.exponentialRampToValueAtTime(50, now + 0.5);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(2.0, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      // 空砲：「かち」
      playKachi() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(950, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      // 除細動器ショック音
      playDefibrillator() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(950, now + 1.2);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.35, now + 1.2);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 1.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);

        setTimeout(() => {
          const shock = this.ctx.createOscillator();
          const sgain = this.ctx.createGain();
          shock.type = 'square';
          shock.frequency.setValueAtTime(130, this.ctx.currentTime);
          shock.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
          sgain.gain.setValueAtTime(1.2, this.ctx.currentTime);
          sgain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
          shock.connect(sgain);
          sgain.connect(this.ctx.destination);
          shock.start();
        }, 1200);
      }

      playRack() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.12);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      // 🪚 ノコギリ切削音（ぎこぎこ）
      playSawGiko() {
        this.resume();
        const now = this.ctx.currentTime;
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250 + (i % 2) * 150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(500, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
          }, i * 140);
        }
      }

      // 🔍 虫眼鏡視認音
      playMagnifier() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      // 🍺 ビール開栓＆吐出音
      playBeerPop() {
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
      }

      // 🚬 タバコ吸い込み音
      playCigaretteSmoke() {
        this.resume();
        const now = this.ctx.currentTime;
        const bufSize = this.ctx.sampleRate * 0.4;
        const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(800, now);
        filter.Q.setValueAtTime(3, now);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }

      // ⛓️ 手錠ガチャ音
      playHandcuffsLock() {
        this.resume();
        const now = this.ctx.currentTime;
        for (let i = 0; i < 2; i++) {
          setTimeout(() => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(700, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
          }, i * 100);
        }
      }
    }

    const sound = new SoundEngine();

    // --- 2. 3D Graphics Setup & Monster Modeling ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.3, 3.2);
    camera.lookAt(0, 0.6, -0.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x181818));
    const spotLight = new THREE.SpotLight(0xff3311, 3.8, 14, Math.PI / 3, 0.5);
    spotLight.position.set(0, 4.8, 0);
    spotLight.castShadow = true;
    scene.add(spotLight);

    // 分割独立テーブル
    const myTableGeo = new THREE.BoxGeometry(2.8, 0.1, 1.0);
    const oppTableGeo = new THREE.BoxGeometry(2.8, 0.1, 1.0);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.85 });

    const myTable = new THREE.Mesh(myTableGeo, tableMat);
    myTable.position.set(0, 0, 0.6);
    scene.add(myTable);

    const oppTable = new THREE.Mesh(oppTableGeo, tableMat);
    oppTable.position.set(0, 0, -0.6);
    scene.add(oppTable);

    // 審判NPC
    const dealerGroup = new THREE.Group();
    const dealerHead = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    dealerHead.position.set(0, 1.5, -1.9);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
    const eyeR = eyeL.clone();
    eyeL.position.set(-0.1, 1.55, -1.6);
    eyeR.position.set(0.1, 1.55, -1.6);
    dealerGroup.add(dealerHead, eyeL, eyeR);
    scene.add(dealerGroup);

    // 👹 異形モンスター生成関数（自分・相手ともに同一デザイン）
    function createMonsterCharacter(isOpponent = true) {
      const monsterGroup = new THREE.Group();
      const monsterMat = new THREE.MeshStandardMaterial({ color: 0x182018, roughness: 0.85, metalness: 0.2 });

      // 頭部（変形長頭）
      const headGeo = new THREE.ConeGeometry(0.38, 0.75, 10);
      const head = new THREE.Mesh(headGeo, monsterMat);
      head.rotation.x = Math.PI;
      head.position.set(0, 1.3, isOpponent ? -1.1 : 1.1);

      // 赤く光る複数の目
      const mEyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      for (let i = 0; i < 6; i++) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), mEyeMat);
        const zOffset = isOpponent ? -0.88 : 0.88;
        eye.position.set((Math.random() - 0.5) * 0.32, 1.15 + (Math.random() - 0.5) * 0.22, zOffset);
        monsterGroup.add(eye);
      }

      // 鋭い角
      const horn1 = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.04, 0.35), monsterMat);
      horn1.position.set(-0.12, 1.6, isOpponent ? -1.1 : 1.1);
      horn1.rotation.z = -0.2;
      const horn2 = horn1.clone();
      horn2.position.x = 0.12;
      horn2.rotation.z = 0.2;
      monsterGroup.add(horn1, horn2);

      // リアルな4本指の手
      function createDetailedHand(sideLeft = true) {
        const handGroup = new THREE.Group();
        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.18), monsterMat);
        handGroup.add(palm);

        for (let f = 0; f < 4; f++) {
          const fingerGroup = new THREE.Group();
          // 第一関節
          const phalanx1 = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.02, 0.09), monsterMat);
          phalanx1.position.y = -0.045;
          fingerGroup.add(phalanx1);
          // 爪
          const claw = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.06, 6), new THREE.MeshBasicMaterial({ color: 0x440000 }));
          claw.rotation.x = Math.PI;
          claw.position.y = -0.11;
          fingerGroup.add(claw);

          fingerGroup.position.set(-0.06 + f * 0.04, 0, 0.09);
          fingerGroup.rotation.x = 0.4;
          handGroup.add(fingerGroup);
        }
        return handGroup;
      }

      const handL = createDetailedHand(true);
      const handR = createDetailedHand(false);

      if (isOpponent) {
        handL.position.set(-0.55, 0.12, -0.4);
        handR.position.set(0.55, 0.12, -0.4);
      } else {
        handL.position.set(-0.75, 0.2, 0.8);
        handR.position.set(0.75, 0.2, 0.8);
        handL.rotation.x = -Math.PI / 4;
        handR.rotation.x = -Math.PI / 4;
      }

      monsterGroup.add(head, handL, handR);
      return { group: monsterGroup, head: head, handL: handL, handR: handR };
    }

    const oppMonster = createMonsterCharacter(true);
    const myMonster = createMonsterCharacter(false);

    scene.add(oppMonster.group);
    scene.add(myMonster.group);

    // 血のパーティクル
    const bloodParticles = [];
    function spawnBlood(isOpponent = true) {
      const zPos = isOpponent ? -0.8 : 0.8;
      for (let i = 0; i < 45; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.035, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0x990000 })
        );
        p.position.set(0, 1.2, zPos);
        p.userData = {
          vx: (Math.random() - 0.5) * 0.12,
          vy: Math.random() * 0.12 + 0.03,
          vz: (Math.random() - 0.5) * 0.12
        };
        scene.add(p);
        bloodParticles.push(p);
      }
    }

    // 🔫 ショットガン3Dモデル
    const gunGroup = new THREE.Group();
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.85 }));
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.08, 0);
    const stock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.4), new THREE.MeshStandardMaterial({ color: 0x3a1e05 }));
    stock.position.set(0, 0.04, 0.6);
    gunGroup.add(barrel, stock);
    gunGroup.position.set(0, 0.15, 0);
    scene.add(gunGroup);

    // Raycaster (3Dアイテムクリック検知)
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const item3DGroup = new THREE.Group();
    scene.add(item3DGroup);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    let oppHeadBaseY = 0;
    function renderAnim() {
      requestAnimationFrame(renderAnim);
      oppMonster.head.position.y = 1.3 + Math.sin(Date.now() * 0.003) * 0.04 + oppHeadBaseY;

      for (let i = bloodParticles.length - 1; i >= 0; i--) {
        const p = bloodParticles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.vy -= 0.004;
        if (p.position.y < 0.05) {
          scene.remove(p);
          bloodParticles.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }
    renderAnim();

    // --- 3. Items 3D Creation & Custom Animations ---
    const ITEMS_DEF = {
      saw: { name: 'ノコギリ', createMesh: createSawMesh, anim: playSawAnimation },
      magnifier: { name: '虫眼鏡', createMesh: createMagnifierMesh, anim: playMagnifierAnimation },
      beer: { name: 'ビール', createMesh: createBeerMesh, anim: playBeerAnimation },
      cigarette: { name: 'タバコ', createMesh: createCigaretteMesh, anim: playCigaretteAnimation },
      handcuffs: { name: '手錠', createMesh: createHandcuffsMesh, anim: playHandcuffsAnimation }
    };

    function createSawMesh() {
      const g = new THREE.Group();
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.06, 0.25), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9 }));
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.08, 0.08), new THREE.MeshStandardMaterial({ color: 0xff2222 }));
      handle.position.z = 0.15;
      g.add(blade, handle);
      return g;
    }

    function createMagnifierMesh() {
      const g = new THREE.Group();
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.02, 16), new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 }));
      lens.rotation.x = Math.PI / 2;
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.2), new THREE.MeshStandardMaterial({ color: 0x333333 }));
      handle.position.y = -0.12;
      g.add(lens, handle);
      return g;
    }

    function createBeerMesh() {
      const can = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.15, 16), new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.5 }));
      return can;
    }

    function createCigaretteMesh() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
      const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.03), new THREE.MeshStandardMaterial({ color: 0xff4400 }));
      tip.position.y = 0.065;
      g.add(body, tip);
      return g;
    }

    function createHandcuffsMesh() {
      const g = new THREE.Group();
      const r1 = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.01, 8, 16), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
      const r2 = r1.clone();
      r2.position.x = 0.12;
      g.add(r1, r2);
      return g;
    }

    // 🪚 ノコギリ切断アニメーション
    function playSawAnimation(mesh, onDone) {
      sound.playSawGiko();
      let startPos = mesh.position.clone();
      let targetPos = new THREE.Vector3(0, 0.2, 0); // 銃先
      let startTime = Date.now();

      function anim() {
        let elapsed = Date.now() - startTime;
        let p = Math.min(elapsed / 1200, 1);

        if (p < 0.4) {
          mesh.position.lerpVectors(startPos, targetPos, p / 0.4);
        } else if (p < 0.9) {
          // ギコギコ往復
          mesh.position.x = Math.sin((p - 0.4) * 40) * 0.08;
        } else {
          mesh.position.y += 0.02;
        }

        if (p < 1) requestAnimationFrame(anim);
        else onDone();
      }
      anim();
    }

    function playMagnifierAnimation(mesh, onDone) {
      sound.playMagnifier();
      let startPos = mesh.position.clone();
      let targetPos = new THREE.Vector3(0, 0.3, 0.2);
      let startTime = Date.now();

      function anim() {
        let elapsed = Date.now() - startTime;
        let p = Math.min(elapsed / 1000, 1);
        mesh.position.lerpVectors(startPos, targetPos, p);
        if (p < 1) requestAnimationFrame(anim);
        else onDone();
      }
      anim();
    }

    function playBeerAnimation(mesh, onDone) {
      sound.playBeerPop();
      let startTime = Date.now();
      function anim() {
        let elapsed = Date.now() - startTime;
        let p = Math.min(elapsed / 800, 1);
        mesh.position.y += 0.005;
        mesh.rotation.z += 0.05;
        if (p < 1) requestAnimationFrame(anim);
        else onDone();
      }
      anim();
    }

    function playCigaretteAnimation(mesh, onDone) {
      sound.playCigaretteSmoke();
      let startTime = Date.now();
      function anim() {
        let elapsed = Date.now() - startTime;
        let p = Math.min(elapsed / 800, 1);
        mesh.position.y += 0.004;
        if (p < 1) requestAnimationFrame(anim);
        else onDone();
      }
      anim();
    }

    function playHandcuffsAnimation(mesh, onDone) {
      sound.playHandcuffsLock();
      let startPos = mesh.position.clone();
      let targetPos = new THREE.Vector3(0, 0.2, -0.4);
      let startTime = Date.now();

      function anim() {
        let elapsed = Date.now() - startTime;
        let p = Math.min(elapsed / 800, 1);
        mesh.position.lerpVectors(startPos, targetPos, p);
        if (p < 1) requestAnimationFrame(anim);
        else onDone();
      }
      anim();
    }

    // --- 4. Game Logic & P2P Network ---
    let peer = null;
    let conn = null;
    let isHost = false;
    let isAI = false;
    const PREFIX = "lod-game-room-v4-";

    let gameState = {
      myHp: 5,        // ハート5個
      oppHp: 5,
      maxHp: 5,
      magazine: [],
      currentTurn: 'host',
      roundCount: 1,
      sawActive: false,
      handcuffed: false,
      myItems: [],
      oppItems: []
    };

    function startBGM() {
      const iframe = document.getElementById('youtube-bgm');
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }

    function rebuild3DItems() {
      while(item3DGroup.children.length > 0) {
        item3DGroup.remove(item3DGroup.children[0]);
      }

      // 自分側テーブル（手前 z=0.6）
      gameState.myItems.forEach((itemKey, i) => {
        const def = ITEMS_DEF[itemKey];
        if (!def) return;
        const mesh = def.createMesh();
        mesh.position.set(-0.9 + i * 0.28, 0.12, 0.6);
        mesh.userData = { itemKey, index: i, owner: 'me' };
        item3DGroup.add(mesh);
      });

      // 相手側テーブル（奥 z=-0.6）
      gameState.oppItems.forEach((itemKey, i) => {
        const def = ITEMS_DEF[itemKey];
        if (!def) return;
        const mesh = def.createMesh();
        mesh.position.set(-0.9 + i * 0.28, 0.12, -0.6);
        mesh.userData = { itemKey, index: i, owner: 'opp' };
        item3DGroup.add(mesh);
      });
    }

    function updateUI() {
      const myHpDiv = document.getElementById('my-hp');
      const oppHpDiv = document.getElementById('opp-hp');
      myHpDiv.innerHTML = '';
      oppHpDiv.innerHTML = '';

      for (let i = 0; i < gameState.maxHp; i++) {
        myHpDiv.innerHTML += `<div class="hp-node ${i < gameState.myHp ? '' : 'empty'}"></div>`;
        oppHpDiv.innerHTML += `<div class="hp-node ${i < gameState.oppHp ? '' : 'empty'}"></div>`;
      }

      const live = gameState.magazine.filter(b => b).length;
      const blank = gameState.magazine.filter(b => !b).length;
      document.getElementById('live-count').innerText = live;
      document.getElementById('blank-count').innerText = blank;

      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');

      const banner = document.getElementById('turn-banner');
      banner.innerText = isMyTurn ? "YOUR TURN" : "OPPONENT'S TURN";
      banner.style.opacity = '1';
      setTimeout(() => { banner.style.opacity = '0'; }, 1200);

      document.getElementById('btn-shoot-opp').disabled = !isMyTurn;
      document.getElementById('btn-shoot-self').disabled = !isMyTurn;

      rebuild3DItems();
    }

    function startRoundSequence() {
      document.getElementById('btn-shoot-opp').disabled = true;
      document.getElementById('btn-shoot-self').disabled = true;

      sound.playRack();
      
      const total = Math.floor(Math.random() * 4) + 3;
      let live = Math.floor(Math.random() * (total - 1)) + 1;
      let blank = total - live;

      const mag = [];
      for (let i = 0; i < live; i++) mag.push(true);
      for (let i = 0; i < blank; i++) mag.push(false);
      for (let i = mag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mag[i], mag[j]] = [mag[j], mag[i]];
      }
      gameState.magazine = mag;

      const giveCount = Math.min(3, Math.floor(gameState.roundCount / 2) + 1);
      for (let k = 0; k < giveCount; k++) {
        if (gameState.myItems.length < 5) gameState.myItems.push(getRandomItemKey());
        if (gameState.oppItems.length < 5) gameState.oppItems.push(getRandomItemKey());
      }
      gameState.roundCount++;

      let startTime = Date.now();
      let duration = 2000;
      let initialRot = gunGroup.rotation.y;
      let targetRot = initialRot + Math.PI * 6 + (Math.random() > 0.5 ? 0 : Math.PI);

      function spinAnim() {
        let elapsed = Date.now() - startTime;
        let progress = Math.min(elapsed / duration, 1);
        let easeOut = 1 - Math.pow(1 - progress, 3);
        gunGroup.rotation.y = initialRot + (targetRot - initialRot) * easeOut;

        if (progress < 1) {
          requestAnimationFrame(spinAnim);
        } else {
          const isFacingMe = Math.abs(gunGroup.rotation.y % (Math.PI * 2)) < 1;
          gameState.currentTurn = isFacingMe ? (isHost ? 'host' : 'guest') : (isHost ? 'guest' : 'host');
          updateUI();
          syncState();

          if (isAI && gameState.currentTurn === 'guest') {
            setTimeout(aiTurn, 1500);
          }
        }
      }
      spinAnim();
    }

    function getRandomItemKey() {
      const keys = Object.keys(ITEMS_DEF);
      return keys[Math.floor(Math.random() * keys.length)];
    }

    // 3Dアイテムのタップ・クリック判定
    window.addEventListener('click', (e) => {
      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');
      if (!isMyTurn) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(item3DGroup.children, true);

      if (intersects.length > 0) {
        let targetMesh = intersects[0].object;
        while (targetMesh.parent && targetMesh.parent !== item3DGroup) {
          targetMesh = targetMesh.parent;
        }

        if (targetMesh.userData && targetMesh.userData.owner === 'me') {
          const { itemKey, index } = targetMesh.userData;
          const def = ITEMS_DEF[itemKey];

          if (def && def.anim) {
            def.anim(targetMesh, () => {
              gameState.myItems.splice(index, 1);
              executeItemLogic(itemKey);
              updateUI();
              syncState();
            });
          }
        }
      }
    });

    function executeItemLogic(itemKey) {
      if (itemKey === 'saw') {
        gameState.sawActive = true;
        alert("ノコギリ: ダメージ2倍！");
      } else if (itemKey === 'magnifier') {
        const nextBullet = gameState.magazine[gameState.magazine.length - 1];
        alert(`虫眼鏡: 次の弾薬は【 ${nextBullet ? '実弾' : '空砲'} 】`);
      } else if (itemKey === 'beer') {
        const ejected = gameState.magazine.pop();
        sound.playRack();
        alert(`ビール: 【 ${ejected ? '実弾' : '空砲'} 】を排水・排除！`);
      } else if (itemKey === 'cigarette') {
        if (gameState.myHp < gameState.maxHp) gameState.myHp++;
        alert("タバコ: ハート(HP)が1回復！");
      } else if (itemKey === 'handcuffs') {
        gameState.handcuffed = true;
        alert("手錠: 相手の次のターンをスキップ！");
      }
    }

    function shoot(target) {
      const isMyTurn = (isHost && gameState.currentTurn === 'host') || (!isHost && gameState.currentTurn === 'guest');
      if (!isMyTurn) return;

      document.getElementById('btn-shoot-opp').disabled = true;
      document.getElementById('btn-shoot-self').disabled = true;

      oppMonster.group.position.z = 0.15;
      setTimeout(() => { oppMonster.group.position.z = 0; }, 300);

      const isLive = gameState.magazine.pop();
      const damage = gameState.sawActive ? 2 : 1;
      gameState.sawActive = false;

      let hitOccurred = false;

      if (isLive) {
        sound.playBang();
        spotLight.intensity = 10;
        setTimeout(() => { spotLight.intensity = 3.8; }, 120);

        if (target === 'opp') {
          gameState.oppHp = Math.max(0, gameState.oppHp - damage);
          spawnBlood(true);
        } else {
          gameState.myHp = Math.max(0, gameState.myHp - damage);
          spawnBlood(false);
        }

        hitOccurred = true;

        if (gameState.handcuffed) {
          gameState.handcuffed = false;
        } else {
          gameState.currentTurn = gameState.currentTurn === 'host' ? 'guest' : 'host';
        }
      } else {
        sound.playKachi();
        if (target === 'opp') {
          if (gameState.handcuffed) {
            gameState.handcuffed = false;
          } else {
            gameState.currentTurn = gameState.currentTurn === 'host' ? 'guest' : 'host';
          }
        }
      }

      updateUI();
      syncState();

      // ⭐ 修正: 被弾してダメージを受けた際、ハート（HP）が残っていれば即座に除細動器が起動！
      if (hitOccurred) {
        if ((target === 'opp' && gameState.oppHp > 0) || (target === 'self' && gameState.myHp > 0)) {
          handleMidGameDefibrillator(target === 'self');
          return;
        }
      }

      // ハートが0なら完全ゲーム終了
      if (gameState.myHp <= 0 || gameState.oppHp <= 0) {
        handleGameOver(gameState.myHp <= 0);
        return;
      }

      if (gameState.magazine.length === 0) {
        setTimeout(startRoundSequence, 1200);
      } else if (isAI && gameState.currentTurn === 'guest') {
        setTimeout(aiTurn, 1500);
      }
    }

    // 被弾ごとの除細動器（⚡ CLEAR! ⚡）蘇生演出
    function handleMidGameDefibrillator(isMeWhoGotHit) {
      sound.playDefibrillator();
      const resus = document.getElementById('resus-overlay');
      const resusTitle = document.getElementById('resus-title');
      const resusSub = document.getElementById('resus-sub');

      resusTitle.innerText = "⚡ CLEAR! ⚡";
      resusTitle.className = "resus-text";
      resusSub.innerText = isMeWhoGotHit ? "あなたの心臓へ除細動ショックを実行中..." : "相手へ除細動ショックを実行中...";
      resus.classList.add('active');

      setTimeout(() => {
        resus.classList.remove('active');
        if (gameState.magazine.length === 0) {
          startRoundSequence();
        } else if (isAI && gameState.currentTurn === 'guest') {
          setTimeout(aiTurn, 1000);
        }
      }, 2000);
    }

    // ハートが完全喪失（0）した場合のゲームオーバー
    function handleGameOver(didIDie) {
      const resus = document.getElementById('resus-overlay');
      const resusTitle = document.getElementById('resus-title');
      const resusSub = document.getElementById('resus-sub');

      if (didIDie) {
        resusTitle.innerText = "YOU DIED";
        resusTitle.className = "death-text";
        resusSub.innerText = "ハートがすべて尽きました...";
        resus.classList.add('active');

        setTimeout(() => {
          alert("GAME OVER - あなたは敗北しました");
          location.reload();
        }, 2500);
      } else {
        resusTitle.innerText = "VICTORY!";
        resusTitle.className = "resus-text";
        resusSub.innerText = "相手を完全に撃破しました！";
        resus.classList.add('active');

        setTimeout(() => {
          alert("YOU SURVIVED! あなたの完全勝利です！");
          location.reload();
        }, 2500);
      }
    }

    function aiTurn() {
      if (gameState.currentTurn !== 'guest' || !isAI) return;

      const live = gameState.magazine.filter(b => b).length;
      const total = gameState.magazine.length;

      if (gameState.oppItems.length > 0 && Math.random() > 0.4) {
        const itemKey = gameState.oppItems.pop();
        executeItemLogic(itemKey);
      }

      if (live / total >= 0.5) {
        shoot('my');
      } else {
        shoot('opp');
      }
    }

    function syncState() {
      if (!isAI && conn) {
        conn.send({ type: 'SYNC', state: gameState });
      }
    }

    function setupNetwork() {
      conn.on('data', (data) => {
        if (data.type === 'SYNC') {
          gameState = data.state;
          updateUI();
          if (isAI && gameState.currentTurn === 'guest') {
            setTimeout(aiTurn, 1500);
          }
        }
      });
    }

    document.getElementById('btn-join').addEventListener('click', () => {
      startBGM();
      sound.resume();
      const code = document.getElementById('roomCode').value;
      if (code.length !== 3) {
        document.getElementById('status-msg').innerText = "3桁の数字を入力してください";
        return;
      }

      const roomID = PREFIX + code;
      document.getElementById('status-msg').innerText = "部屋に接続中...";
      peer = new Peer(roomID);

      peer.on('open', () => {
        isHost = true;
        document.getElementById('status-msg').innerText = "部屋を作成しました。相手を待っています...";
        peer.on('connection', (c) => {
          conn = c;
          setupNetwork();
          startGame();
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          isHost = false;
          peer.destroy();
          peer = new Peer();
          peer.on('open', () => {
            conn = peer.connect(roomID);
            setupNetwork();
            startGame();
          });
        }
      });
    });

    document.getElementById('btn-ai').addEventListener('click', () => {
      startBGM();
      sound.resume();
      isAI = true;
      isHost = true;
      startGame();
    });

    function startGame() {
      document.getElementById('title-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('game-ui').style.display = 'flex';
        startRoundSequence();
      }, 800);
    }

    document.getElementById('btn-shoot-opp').addEventListener('click', () => shoot('opp'));
    document.getElementById('btn-shoot-self').addEventListener('click', () => shoot('self'));
  </script>
</body>
</html>
